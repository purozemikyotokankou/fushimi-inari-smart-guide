<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f7">
    <title>伏見稲荷スマートガイド</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/planner.css?v=27-bottom-sheet-details">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
</head>

<body data-google-form-url="https://docs.google.com/forms/d/e/1FAIpQLSfZQYyVeUwdfxDnmGi2dWMtzfNxWuxCfhIR0BTycJzAO8pytQ/viewform?usp=dialog">

<header class="planner-site-header">
    <div class="logo" aria-label="伏見稲荷スマートガイド"><span class="logo-mark" aria-hidden="true">⛩</span><span class="logo-full">伏見稲荷スマートガイド</span></div>

    <nav aria-label="Main navigation">
        <a href="home.html" data-i18n="home">ホーム</a>
        <a href="planner.html" data-i18n="planner">ルート</a>
        <a href="spots.html" data-i18n="spots">スポット</a>
    </nav>

    <select id="languageSelect" aria-label="Language">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇺🇸 English</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ko">🇰🇷 한국어</option>
    </select>
</header>

<main class="planner-page">
    <div class="planner-workspace">

        <section class="planner-map-panel" aria-label="Map">
            <div class="planner-map-section">
                <div class="planner-map-title">
                    <span class="planner-map-eyebrow">FUSHIMI INARI · SMART GUIDE</span>
                    <h1>観光マップ</h1>
                </div>

                <div id="map" aria-label="伏見稲荷の地図"></div>

                <div class="planner-top-actions" aria-label="Map actions">
                    <button type="button" id="openMapSearchBtn" class="map-action-tile map-search-action" aria-label="スポットを検索" aria-expanded="false" aria-controls="mapSearchPopover">
                        <span class="map-action-icon map-action-no-icon" aria-hidden="true">no icon</span>
                        <span class="map-action-label">検索</span>
                    </button>
                    <button type="button" id="createRouteBtn" class="map-action-tile map-route-action" aria-label="選択したスポットでルートを作成">
                        <span class="map-action-icon map-action-no-icon" aria-hidden="true">no icon</span>
                        <span class="map-action-label">ルート作成</span>
                    </button>
                </div>
                <div class="map-search-popover" id="mapSearchPopover" hidden>
                    <label for="searchInput">スポットを検索</label>
                    <div class="map-search-input-row">
                        <input id="searchInput" class="planner-search-input" type="search" autocomplete="off" placeholder="スポット名・キーワード">
                        <button type="button" id="closeMapSearchBtn" class="map-search-close" aria-label="検索を閉じる">×</button>
                    </div>
                </div>
                <div class="planner-location-dock" aria-label="Current location">
                    <button type="button" id="locationBtn" class="map-action-tile map-location-action" title="現在地を表示" aria-label="現在地を表示">
                        <span class="map-action-icon map-action-no-icon" aria-hidden="true">no icon</span>
                        <span class="map-action-label">現在地</span>
                    </button>
                </div>

                <div class="planner-map-hint" aria-hidden="true">地図を動かしてスポットを探せます</div>
            </div>
        </section>

        <aside class="planner-spot-panel" id="plannerBottomSheet" aria-label="Spot information">
            <button
                type="button"
                id="plannerSheetHandle"
                class="planner-sheet-handle"
                aria-expanded="false"
                aria-controls="plannerSheetContent"
                aria-label="上にスワイプで展開、下にスワイプで収納"
            >
                <span class="planner-sheet-grabber" aria-hidden="true"></span>
                
            </button>

            <div id="plannerSheetContent" class="planner-sheet-content">

                <section class="planner-category-tray" aria-label="Spot categories" id="plannerCategoryTray">
                    <div class="planner-category-grid">
                        <button type="button" class="category category-button active" data-category="all"><span class="category-glyph" aria-hidden="true"><svg class="category-svg" viewBox="0 0 24 24"><path d="M3 6.2 9 3l6 3.2L21 3v14.8L15 21l-6-3.2L3 21Z"/><path d="M9 3v14.8M15 6.2V21"/></svg></span><span class="category-label" data-ja="すべて" data-en="All" data-zh="全部" data-ko="전체">すべて</span></button>
                        <button type="button" class="category category-button" data-category="景観"><span class="category-glyph" aria-hidden="true"><svg class="category-svg" viewBox="0 0 24 24"><path d="m2.5 19 6.2-10 4.1 6 2.6-3.6L21.5 19Z"/><path d="m8.7 9 2-3 4.7 7"/></svg></span><span class="category-label" data-ja="景観" data-en="Scenery" data-zh="景观" data-ko="경관">景観</span></button>
                        <button type="button" class="category category-button" data-category="神社"><span class="category-glyph" aria-hidden="true"><svg class="category-svg" viewBox="0 0 24 24"><path d="M4 7h16M3 4h18M6 7v14M18 7v14M4 12h16M9 12v9M15 12v9"/><path d="m5 4 2-2h10l2 2"/></svg></span><span class="category-label" data-ja="神社" data-en="Shrines" data-zh="神社" data-ko="신사">神社</span></button>
                        <button type="button" class="category category-button" data-category="登山"><span class="category-glyph" aria-hidden="true"><svg class="category-svg" viewBox="0 0 24 24"><path d="m3 20 6-9 3 4 3-7 6 12Z"/><path d="m12 8 3-4 4 1"/></svg></span><span class="category-label" data-ja="登山" data-en="Hiking" data-zh="登山" data-ko="등산">登山</span></button>
                        <button type="button" class="category category-button" data-category="グルメ"><span class="category-glyph" aria-hidden="true"><svg class="category-svg" viewBox="0 0 24 24"><path d="M3 12h18c-.6 5-4.2 8-9 8s-8.4-3-9-8Z"/><path d="M5 9c1.2-1.1 2.4-1.1 3.6 0S11 10.1 12.2 9s2.4-1.1 3.6 0 2.4 1.1 3.6 0"/><path d="M8 3v3M12 2v3M16 3v3"/></svg></span><span class="category-label" data-ja="買う・食べる" data-en="Shop & Eat" data-zh="购物·餐饮" data-ko="쇼핑·식사">買う・食べる</span></button>
                        <button type="button" class="category category-button" data-category="交通"><span class="category-glyph" aria-hidden="true"><svg class="category-svg" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="16" rx="4"/><path d="M5 12h14M8 7h.1M16 7h.1M8 22l3-3.5M16 22l-3-3.5M8 15h.1M16 15h.1"/></svg></span><span class="category-label" data-ja="交通" data-en="Transit" data-zh="交通" data-ko="교통">交通</span></button>
                        <button type="button" class="category category-button" data-category="施設"><span class="category-glyph" aria-hidden="true"><svg class="category-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></span><span class="category-label" data-ja="施設" data-en="Facilities" data-zh="设施" data-ko="시설">施設</span></button>
                    </div>
                    <div id="foodSubcategories" class="food-subcategories" hidden>
                        <button type="button" class="food-subcategory active" data-food-filter="all">すべて</button>
                        <button type="button" class="food-subcategory" data-food-filter="buy">買う</button>
                        <button type="button" class="food-subcategory" data-food-filter="eat">食べる</button>
                    </div>
                </section>

                <section class="spot-list-window">
                    <div id="spotList">
                        <!-- planner.js -->
                    </div>
                </section>

                <section class="selected-section">
                    <div class="sheet-section-heading">
                        <h2 data-i18n="selectedSpots">選択したスポット</h2>
                        <span class="sheet-section-note">ルート順</span>
                    </div>
                    <div id="selectedSpots">
                        <div id="selectedList">
                            <p>スポットを選択してください。</p>
                        </div>
                    </div>
                </section>

                <section class="route-info" aria-label="Route information">
                    <div class="sheet-section-heading">
                        <h2 data-i18n="routeInfo">ルート情報</h2>
                    </div>
                    <div class="route-info-content">
                        <div class="route-stat">
                            <span class="route-stat-label" data-i18n="numberOfSpots">スポット数</span>
                            <strong id="spotCount">0か所</strong>
                        </div>
                        <div class="route-stat">
                            <span class="route-stat-label">距離</span>
                            <strong id="distance">0 km</strong>
                        </div>
                        <div class="route-stat">
                            <span class="route-stat-label">徒歩時間</span>
                            <strong id="walkTime">0分</strong>
                        </div>
                        <div class="route-stat">
                            <span class="route-stat-label">滞在時間</span>
                            <strong id="stayTime">0分</strong>
                        </div>
                    </div>
                </section>

                <section class="planner-actions">
                    <button type="button" id="saveRoute" class="sheet-action sheet-action-primary">💾 <span data-i18n="saveRoute">ルートを保存</span></button>
                    <button type="button" id="googleFormButton" class="sheet-action">📝 アンケート</button>
                </section>
            </div>
        </aside>

        <section id="mapSpotDetail" class="map-spot-detail is-compact" aria-label="スポット詳細" hidden>
            <button type="button" id="mapSpotDetailHandle" class="map-spot-detail-handle" aria-label="上にスワイプして詳細を表示">
                <span class="map-spot-detail-grabber" aria-hidden="true"></span>
            </button>
            <button type="button" id="closeMapSpotDetail" class="map-spot-detail-close" aria-label="スポット詳細を閉じる">×</button>
            <div id="mapSpotDetailContent" class="map-spot-detail-content"></div>
        </section>
    </div>
</main>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/language.js"></script>
<script src="js/planner.js?v=27-bottom-sheet-details"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const links = document.querySelectorAll(".planner-site-header nav a");
        const file = window.location.pathname.split("/").pop() || "home.html";
        links.forEach(function (link) {
            const href = (link.getAttribute("href") || "").split("/").pop();
            if (href === file) {
                link.classList.add("nav-active");
                link.setAttribute("aria-current", "page");
            }
        });
    });
</script>
</body>
</html>
