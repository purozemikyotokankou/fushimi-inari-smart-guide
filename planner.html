<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f7">
    <title>Fushimi Inari Smart Guide - ルート作成</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/planner.css?v=22-metamap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
</head>

<body data-google-form-url="https://docs.google.com/forms/d/e/1FAIpQLSfZQYyVeUwdfxDnmGi2dWMtzfNxWuxCfhIR0BTycJzAO8pytQ/viewform?usp=dialog">

<header class="planner-site-header">
    <div class="logo">⛩ Fushimi Inari Smart Guide</div>

    <nav aria-label="Main navigation">
        <a href="home.html" data-i18n="home">ホーム</a>
        <a href="planner.html" data-i18n="planner">ルート作成</a>
        <a href="spots.html" data-i18n="spots">スポット</a>
    </nav>

    <select id="languageSelect" aria-label="Language">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇺🇸 English</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ko">🇰🇷 한국어</option>
    </select>
</header>

<main class="planner-page">
    <div class="planner-workspace">

        <section class="planner-map-panel" aria-label="Map">
            <div class="planner-map-section">
                <div class="planner-map-title">
                    <span class="planner-map-eyebrow">FUSHIMI INARI · SMART GUIDE</span>
                    <h1>観光マップ</h1>
                </div>

                <div id="map" aria-label="伏見稲荷の地図"></div>

                <div class="planner-map-buttons" aria-label="Map actions">
                    <button type="button" id="locationBtn" class="map-fab" title="現在地を表示" aria-label="現在地を表示">⌖<span class="map-control-tooltip">現在地</span></button>
                    <button type="button" id="createRouteBtn" class="map-primary-action" aria-label="選択したスポットでルートを作成">🧭 <span>ルート作成</span></button>
                    <button type="button" id="clearBtn" class="map-fab map-fab-clear" title="ルートを消去" aria-label="ルートを消去">↺</button>
                </div>

                <div class="planner-map-hint" aria-hidden="true">地図を動かしてスポットを探せます</div>
            </div>
        </section>

        <aside class="planner-spot-panel" id="plannerBottomSheet" aria-label="Spot information">
            <button
                type="button"
                id="plannerSheetHandle"
                class="planner-sheet-handle"
                aria-expanded="false"
                aria-controls="plannerSheetContent"
                aria-label="上にスワイプで展開、下にスワイプで収納"
            >
                <span class="planner-sheet-grabber" aria-hidden="true"></span>
                <span class="planner-sheet-handle-text">スポット一覧</span>
                <span id="plannerSheetCount" class="planner-sheet-count">0か所選択中</span>
            </button>

            <div id="plannerSheetContent" class="planner-sheet-content">

                <section class="selected-section">
                    <div class="sheet-section-heading">
                        <h2 data-i18n="selectedSpots">選択したスポット</h2>
                        <span class="sheet-section-note">ルート順</span>
                    </div>
                    <div id="selectedSpots">
                        <div id="selectedList">
                            <p>スポットを選択してください。</p>
                        </div>
                    </div>
                </section>

                <section class="planner-category-tray" aria-label="Spot categories" id="plannerCategoryTray">
                    <div class="planner-category-grid">
                        <button type="button" class="category category-button active" data-category="all"><span class="category-glyph">✦</span><span class="category-label" data-ja="すべて" data-en="All" data-zh="全部" data-ko="전체">すべて</span><span class="category-description" data-ja="すべてのスポット" data-en="All places" data-zh="所有地点" data-ko="모든 장소">すべてのスポット</span></button>
                        <button type="button" class="category category-button" data-category="景観"><span class="category-glyph">◒</span><span class="category-label" data-ja="景観" data-en="Scenery" data-zh="景观" data-ko="경관">景観</span><span class="category-description" data-ja="景色・展望" data-en="Views" data-zh="风景与观景" data-ko="풍경·전망">景色・展望</span></button>
                        <button type="button" class="category category-button" data-category="神社"><span class="category-glyph">⛩</span><span class="category-label" data-ja="神社" data-en="Shrines" data-zh="神社" data-ko="신사">神社</span><span class="category-description" data-ja="神社・鳥居" data-en="Shrines & torii" data-zh="神社与鸟居" data-ko="신사·도리이">神社・鳥居</span></button>
                        <button type="button" class="category category-button" data-category="登山"><span class="category-glyph">↗</span><span class="category-label" data-ja="登山" data-en="Hiking" data-zh="登山" data-ko="등산">登山</span><span class="category-description" data-ja="山道・休憩" data-en="Trails & rest" data-zh="山路与休息" data-ko="산길·휴식">山道・休憩</span></button>
                        <button type="button" class="category category-button" data-category="グルメ"><span class="category-glyph">🍜</span><span class="category-label" data-ja="飲食店" data-en="Food" data-zh="餐饮" data-ko="음식점">飲食店</span><span class="category-description" data-ja="食事・カフェ" data-en="Food & cafés" data-zh="餐厅与咖啡馆" data-ko="식당·카페">食事・カフェ</span></button>
                        <button type="button" class="category category-button" data-category="交通"><span class="category-glyph">🚉</span><span class="category-label" data-ja="交通" data-en="Transit" data-zh="交通" data-ko="교통">交通</span><span class="category-description" data-ja="駅・移動" data-en="Stations" data-zh="车站与交通" data-ko="역·이동">駅・移動</span></button>
                        <button type="button" class="category category-button" data-category="施設"><span class="category-glyph">＋</span><span class="category-label" data-ja="施設" data-en="Facilities" data-zh="设施" data-ko="시설">施設</span><span class="category-description" data-ja="トイレ・案内" data-en="Toilets & info" data-zh="厕所与咨询" data-ko="화장실·안내">トイレ・案内</span></button>
                    </div>
                </section>

                <section class="spot-list-window">
                    <div class="sheet-section-heading">
                        <h2 data-i18n="spotList">スポット一覧</h2>
                        <span class="sheet-section-note">地図からも選べます</span>
                    </div>
                    <div id="spotList">
                        <!-- planner.js -->
                    </div>
                </section>

                <section class="route-info" aria-label="Route information">
                    <div class="sheet-section-heading">
                        <h2 data-i18n="routeInfo">ルート情報</h2>
                    </div>
                    <div class="route-info-content">
                        <div class="route-stat">
                            <span class="route-stat-label" data-i18n="numberOfSpots">スポット数</span>
                            <strong id="spotCount">0か所</strong>
                        </div>
                        <div class="route-stat">
                            <span class="route-stat-label">距離</span>
                            <strong id="distance">0 km</strong>
                        </div>
                        <div class="route-stat">
                            <span class="route-stat-label">徒歩時間</span>
                            <strong id="walkTime">0分</strong>
                        </div>
                        <div class="route-stat">
                            <span class="route-stat-label">滞在時間</span>
                            <strong id="stayTime">0分</strong>
                        </div>
                    </div>
                </section>

                <section class="planner-actions">
                    <button type="button" id="saveRoute" class="sheet-action sheet-action-primary">💾 <span data-i18n="saveRoute">ルートを保存</span></button>
                    <button type="button" id="googleFormButton" class="sheet-action">📝 アンケート</button>
                </section>
            </div>
        </aside>
    </div>
</main>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/language.js"></script>
<script src="js/planner.js?v=22-metamap"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const links = document.querySelectorAll(".planner-site-header nav a");
        const file = window.location.pathname.split("/").pop() || "home.html";
        links.forEach(function (link) {
            const href = (link.getAttribute("href") || "").split("/").pop();
            if (href === file) {
                link.classList.add("nav-active");
                link.setAttribute("aria-current", "page");
            }
        });
    });
</script>
</body>
</html>
