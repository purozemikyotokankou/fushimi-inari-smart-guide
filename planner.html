<style id="fushimi-adaptive-light-styles">
/* V82 — same adaptive edge-light look, anchored to the screen edge above Leaflet tiles. */
#map {
    --fushimi-night-level: 0;
    --fushimi-map-brightness: 1;
    --fushimi-map-saturation: 1;
}
#map .leaflet-tile-pane {
    filter: brightness(var(--fushimi-map-brightness, 1)) saturate(var(--fushimi-map-saturation, 1));
    transition: filter 26s linear;
}
#fushimiAdaptiveLight {
    position: absolute !important;
    inset: 0 !important;
    z-index: 650 !important;
    display: block !important;
    visibility: visible !important;
    overflow: hidden;
    pointer-events: none;
    isolation: isolate;
    --fushimi-edge-rgb: 255, 178, 120;
    --fushimi-light-strength: .76;
    --fushimi-light-blur: 2px;
}
#fushimiAdaptiveLight::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(180deg,
            rgba(var(--fushimi-edge-rgb), .48) 0px,
            rgba(var(--fushimi-edge-rgb), .42) 28px,
            rgba(var(--fushimi-edge-rgb), .31) 52px,
            rgba(var(--fushimi-edge-rgb), .20) 82px,
            rgba(var(--fushimi-edge-rgb), .105) 128px,
            rgba(var(--fushimi-edge-rgb), .035) 185px,
            transparent 245px),
        linear-gradient(90deg,
            rgba(var(--fushimi-edge-rgb), .11),
            transparent 16%, transparent 84%,
            rgba(var(--fushimi-edge-rgb), .11));
    mix-blend-mode: screen;
    filter: blur(var(--fushimi-light-blur));
    opacity: .82;
    transition: filter 5s ease, opacity 18s ease, background 24s ease;
}
#fushimiAdaptiveLight::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow:
        inset 0 14px 42px -7px rgba(var(--fushimi-edge-rgb), .34),
        inset 0 0 46px -15px rgba(var(--fushimi-edge-rgb), .18),
        inset 0 -3px 24px -15px rgba(var(--fushimi-edge-rgb), .10);
    opacity: .92;
    transition: box-shadow 24s ease, opacity 10s ease;
}
#fushimiAdaptiveLight .fushimi-adaptive-light-source {
    position: absolute;
    top: -2px;
    left: 94%;
    width: min(58vw, 760px);
    height: 245px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 0%,
        rgba(var(--fushimi-edge-rgb), .36) 0%,
        rgba(var(--fushimi-edge-rgb), .20) 35%,
        rgba(var(--fushimi-edge-rgb), .08) 58%,
        transparent 82%);
    filter: blur(var(--fushimi-light-blur));
    opacity: var(--fushimi-light-strength, .76);
    pointer-events: none;
    transition: left 28s cubic-bezier(.22,.61,.36,1), background 24s ease, filter 5s ease, opacity 18s ease;
}

<script type="module" id="planner-hybrid-bootstrap-v152">
/* V152: one HTML entry point; inline MapLibre/Leaflet bridge and legacy planner bootstrap. */
/*
 * Fushimi Inari Smart Guide — V152 hybrid map loader
 * - MapLibre GL JS renders the basemap.
 * - The existing Leaflet planner remains responsible for spot/category UI,
 *   route selection, route creation, saved routes and marker/route overlays.
 * - routes.json is preferred; FOSSGIS OSM foot routing is the fallback for gaps.
 */
const VERSION = 151;
const log = (...args) => console.info('[Fushimi Hybrid V152]', ...args);
const warn = (...args) => console.warn('[Fushimi Hybrid V152]', ...args);

function waitForEvent(target, successEvent, timeoutMs = 11000) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (value) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      target.off?.('error', onError);
      target.off?.(successEvent, onSuccess);
      resolve(value);
    };
    const onSuccess = () => finish(true);
    const onError = () => finish(false);
    const timer = setTimeout(() => finish(false), timeoutMs);
    target.once(successEvent, onSuccess);
    target.on('error', onError);
  });
}

async function importMapLibre() {
  if (window.maplibregl?.Map) return window.maplibregl;
  const urls = [
    'https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.mjs',
    'https://cdn.jsdelivr.net/npm/maplibre-gl@6.18.0/dist/maplibre-gl.mjs'
  ];
  const errors = [];
  for (const url of urls) {
    try {
      const module = await import(url);
      if (typeof module.Map !== 'function') throw new Error('Map export was not found');
      window.maplibregl = module;
      return module;
    } catch (error) {
      errors.push(`${new URL(url).hostname}: ${error?.message || error}`);
    }
  }
  throw new Error(`MapLibreの読み込みに失敗しました (${errors.join(' / ')})`);
}


async function waitForLeaflet(timeoutMs = 8000) {
  const started = Date.now();
  while (!window.L?.map) {
    if (Date.now() - started >= timeoutMs) {
      throw new Error('Leafletが読み込まれていません。CDN通信を確認してください。');
    }
    await new Promise(resolve => setTimeout(resolve, 40));
  }
  return window.L;
}

async function createMapLibreBasemap() {
  const host = document.getElementById('maplibreBasemap');
  if (!host) throw new Error('planner.htmlに #maplibreBasemap がありません');
  const key = String(window.FUSHIMI_CARTO_BASEMAP_API_KEY || '').trim();
  if (!key) throw new Error('CARTO APIキーが設定されていません');

  const module = await importMapLibre();
  const tileUrl = 'https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=' + encodeURIComponent(key);
  const style = {
    version: 8,
    name: 'CARTO Positron',
    sources: {
      'carto-positron': {
        type: 'raster',
        tiles: [tileUrl],
        tileSize: 256,
        minzoom: 0,
        maxzoom: 18
      }
    },
    layers: [
      { id: 'background', type: 'background', paint: { 'background-color': '#f5f6f8' } },
      { id: 'carto-positron', type: 'raster', source: 'carto-positron', minzoom: 0, maxzoom: 22 }
    ]
  };

  let tileErrors = 0;
  const map = new module.Map({
    container: host,
    style,
    center: [135.7743, 34.96705],
    zoom: 16,
    minZoom: 0,
    maxZoom: 18,
    maxBounds: [[135.759, 34.9502], [135.809, 34.9862]],
    pitch: 0,
    bearing: 0,
    attributionControl: false,
    interactive: true,
    dragRotate: false,
    touchPitch: false,
    cooperativeGestures: false,
    fadeDuration: 100
  });
  map.on('error', () => { tileErrors += 1; });

  const ready = await waitForEvent(map, 'idle', 12000);
  if (!ready || tileErrors > 0) {
    try { map.remove(); } catch (_) {}
    throw new Error(!ready ? 'MapLibreの地図タイル読み込みが時間内に完了しませんでした' : 'CARTO地図タイルの読み込みでエラーが発生しました');
  }

  window.__FUSHIMI_HYBRID_MAPLIBRE__ = map;
  document.body.classList.add('is-maplibre-hybrid');
  log('MapLibre + CARTO basemap ready');
  return map;
}

function installLeafletBridge(baseMap) {
  if (!window.L?.map || window.__FUSHIMI_HYBRID_BRIDGE_INSTALLED__) {
    if (!window.L?.map) throw new Error('Leafletがplanner.jsより先に読み込まれていません');
    return;
  }
  window.__FUSHIMI_HYBRID_BRIDGE_INSTALLED__ = true;

  const nativeMapFactory = window.L.map;
  const nativeTileLayer = window.L.tileLayer;

  // The old planner creates a Leaflet map for marker/polyline compatibility.
  // Capture it and keep its camera synchronized with the visible MapLibre map.
  window.L.map = function (...args) {
    const leafletMap = nativeMapFactory.apply(this, args);
    window.__FUSHIMI_LEGACY_LEAFLET_MAP__ = leafletMap;
    let fromMapLibre = false;
    let fromLeaflet = false;
    let frame = 0;

    const syncMapLibreFromLeaflet = () => {
      if (fromMapLibre || fromLeaflet || frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        if (!baseMap || !leafletMap) return;
        const center = leafletMap.getCenter();
        const zoom = Math.max(0, Math.min(18, leafletMap.getZoom()));
        fromLeaflet = true;
        baseMap.jumpTo({ center: [center.lng, center.lat], zoom, bearing: 0, pitch: 0 });
        fromLeaflet = false;
      });
    };

    baseMap.on('move', () => {
      if (fromLeaflet || fromMapLibre) return;
      const center = baseMap.getCenter();
      const zoom = Math.max(0, Math.min(18, baseMap.getZoom()));
      fromMapLibre = true;
      leafletMap.setView([center.lat, center.lng], zoom, { animate: false });
      fromMapLibre = false;
    });

    leafletMap.on('move zoom', syncMapLibreFromLeaflet);
    leafletMap.on('resize', () => baseMap.resize());
    leafletMap.whenReady(syncMapLibreFromLeaflet);

    // Keep the adaptive map-light treatment synchronized with the basemap.
    const leafContainer = leafletMap.getContainer();
    const baseContainer = document.getElementById('maplibreBasemap');
    const copyBrightness = () => {
      const style = getComputedStyle(leafContainer);
      baseContainer.style.setProperty('--hybrid-map-brightness', style.getPropertyValue('--fushimi-map-brightness').trim() || '1');
      baseContainer.style.setProperty('--hybrid-map-saturation', style.getPropertyValue('--fushimi-map-saturation').trim() || '1');
    };
    copyBrightness();
    if (window.MutationObserver) {
      const observer = new MutationObserver(copyBrightness);
      observer.observe(leafContainer, { attributes: true, attributeFilter: ['style', 'class'] });
    }
    const resizeObserver = window.ResizeObserver ? new ResizeObserver(() => baseMap.resize()) : null;
    resizeObserver?.observe(baseContainer);
    return leafletMap;
  };

  // The old page's CARTO Leaflet tile layer is replaced by a no-op layer.
  // Its attribution is retained; MapLibre is the only basemap renderer.
  window.L.tileLayer = function (url, options = {}, ...rest) {
    if (typeof url === 'string' && url.includes('basemaps.cartocdn.com/rastertiles/light_all/')) {
      return {
        on() { return this; },
        addTo(leafletMap) {
          if (options.attribution && leafletMap?.attributionControl) {
            leafletMap.attributionControl.addAttribution(options.attribution);
          }
          return this;
        }
      };
    }
    return nativeTileLayer.call(this, url, options, ...rest);
  };
}

function installFootRoutingThrottle() {
  const cache = new Map();
  let queue = Promise.resolve();
  let lastRequestAt = 0;
  window.__FUSHIMI_HYBRID_ROUTING_FETCH__ = (url) => {
    const cached = cache.get(url);
    if (cached) return Promise.resolve(cached.clone());

    const request = queue.then(async () => {
      const wait = Math.max(0, 1100 - (Date.now() - lastRequestAt));
      if (wait) await new Promise(resolve => setTimeout(resolve, wait));
      lastRequestAt = Date.now();
      const response = await fetch(url, { method: 'GET', cache: 'no-store', headers: { Accept: 'application/json' } });
      if (response.ok) cache.set(url, response.clone());
      return response;
    });
    queue = request.then(() => undefined, () => undefined);
    return request;
  };
}

function patchLegacyPlanner(source) {
  const oldEndpoint = '"https://router.project-osrm.org/route/v1/foot/" +';
  if (!source.includes(oldEndpoint)) throw new Error('旧ルートのOSRM接続先が見つかりません');
  source = source.replace(oldEndpoint, '"https://routing.openstreetmap.de/routed-foot/route/v1/driving/" +');

  const osrmStart = source.indexOf('async function getOSRMRoute(');
  const walkingStart = source.indexOf('async function getWalkingRoute(', osrmStart);
  if (osrmStart < 0 || walkingStart < 0) throw new Error('旧ルート関数の位置を確認できません');
  let osrmBlock = source.slice(osrmStart, walkingStart);
  const fetchPattern = /const response\s*=\s*await fetch\(url\);/;
  if (!fetchPattern.test(osrmBlock)) throw new Error('旧ルートAPIのfetch処理が見つかりません');
  osrmBlock = osrmBlock.replace(fetchPattern, 'const response = await window.__FUSHIMI_HYBRID_ROUTING_FETCH__(url);');
  source = source.slice(0, osrmStart) + osrmBlock + source.slice(walkingStart);

  const attributionOld = `const OSRM_ROUTE_ATTRIBUTION =
        'Routing by <a href="https://project-osrm.org/" target="_blank" rel="noopener noreferrer">OSRM</a>';`;
  const attributionNew = `const OSRM_ROUTE_ATTRIBUTION =
        'Routing by <a href="https://project-osrm.org/" target="_blank" rel="noopener noreferrer">OSRM</a> · ' +
        '<a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener noreferrer">FOSSGIS routing</a> · ' +\n        '<a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener noreferrer">Fix the map</a>';`;
  if (!source.includes(attributionOld)) throw new Error('ルート提供元クレジットの位置を確認できません');
  source = source.replace(attributionOld, attributionNew);

  const localGapThrow = 'throw new Error(`${getLocalizedValue(from.name)} → ${getLocalizedValue(to.name)} は参道データで接続されていません。参道データを追加してください。`);';
  const localGapFallback = `const external = await getOSRMRoute(
            { lat: Number(from.lat), lng: Number(from.lng) },
            { lat: Number(to.lat), lng: Number(to.lng) }
        );
        return {
            coordinates: external,
            paths: [external],
            source: "OSM-FOOT-FALLBACK",
            legs: []
        };`;
  if (!source.includes(localGapThrow)) throw new Error('スポット間ルートのフォールバック位置を確認できません');
  source = source.replace(localGapThrow, localGapFallback);

  const locationGapThrow = 'throw new Error(`${getLocalizedValue(target.name)} まで既存の参道データがつながっていません。`);';
  const locationGapFallback = `const external = await getOSRMRoute(
                    { lat: Number(location.lat), lng: Number(location.lng) },
                    { lat: Number(target.lat), lng: Number(target.lng) }
                );
                return {
                    coordinates: external,
                    paths: [external],
                    source: "OSM-FOOT-FALLBACK",
                    legs: []
                };`;
  if (!source.includes(locationGapThrow)) throw new Error('現在地ルートのフォールバック位置を確認できません');
  source = source.replace(locationGapThrow, locationGapFallback);

  // planner.js normally waits for DOMContentLoaded. Since this module fetches and
  // injects it dynamically, that event may already have fired; convert the wrapper
  // to an immediate-or-deferred initializer so it always starts exactly once.
  const readyMarker = 'document.addEventListener("DOMContentLoaded", function () {';
  if (!source.includes(readyMarker)) throw new Error('旧planner.jsの起動処理を確認できません');
  source = source.replace(readyMarker, 'const __fushimiLegacyPlannerStart = function () {');
  const finalClose = source.lastIndexOf('\n});');
  if (finalClose < 0) throw new Error('旧planner.jsの終了位置を確認できません');
  source = source.slice(0, finalClose) +
    '\n};\nif (document.readyState === "loading") {\n' +
    '  document.addEventListener("DOMContentLoaded", __fushimiLegacyPlannerStart, { once: true });\n' +
    '} else {\n  __fushimiLegacyPlannerStart();\n}\n' +
    source.slice(finalClose + 4);

  return source + '\n//# sourceURL=planner.js?v=151-single-patched\n';
}

async function loadLegacyPlanner() {
  const response = await fetch('js/planner.js?v=151-single-source', { cache: 'no-store' });
  if (!response.ok) throw new Error(`planner.js の取得に失敗しました (HTTP ${response.status})`);
  let source = await response.text();
  source = patchLegacyPlanner(source);
  const blobUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = blobUrl;
    script.onload = () => { URL.revokeObjectURL(blobUrl); resolve(); };
    script.onerror = () => { URL.revokeObjectURL(blobUrl); reject(new Error('旧ルート作成プログラムの起動に失敗しました')); };
    document.head.appendChild(script);
  });
  log('Legacy category bar and route planner loaded with OSM foot-route fallback');
}

async function boot() {
  installFootRoutingThrottle();
  let hybridMap = null;
  try {
    await waitForLeaflet();
    hybridMap = await createMapLibreBasemap();
    installLeafletBridge(hybridMap);
  } catch (error) {
    // Keep a working legacy CARTO/Leaflet map as a fallback if MapLibre or CARTO
    // cannot load. Do not suppress the original Leaflet tiles in this case.
    warn('MapLibre basemap unavailable; keeping the original Leaflet map:', error);
    document.body.classList.remove('is-maplibre-hybrid');
  }

  try {
    await loadLegacyPlanner();
  } catch (error) {
    console.error('[Fushimi Hybrid V152] Planner startup failed:', error);
    const message = document.createElement('p');
    message.className = 'planner-hybrid-error';
    message.textContent = 'ルート作成機能の起動に失敗しました。ページを再読み込みしてください。詳細はブラウザーのConsoleを確認してください。';
    document.querySelector('.planner-map-section')?.appendChild(message);
    // A failed source patch must not leave users with a blank screen. Try the
    // unmodified legacy planner as a last-resort recovery path.
    const script = document.createElement('script');
    script.src = 'js/planner.js?v=138-modular-startup';
    document.head.appendChild(script);
  }
}

boot();
