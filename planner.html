<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fushimi Inari Smart Guide - ルート作成</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/planner.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <style>
        /* =========================================================
           PLANNER — LIQUID GLASS / APPLE INSPIRED
           機能用ID・JavaScriptは既存のまま
        ========================================================= */

        :root {
            --planner-bg: #f5f5f7;
            --planner-white: #ffffff;
            --planner-text: #1d1d1f;
            --planner-gray: #86868b;
            --planner-soft-gray: #6e6e73;
            --planner-red: #c40018;
            --planner-red-soft: rgba(196, 0, 24, 0.10);
            --glass: rgba(255, 255, 255, 0.58);
            --glass-strong: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.62);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 10% 8%, rgba(255, 255, 255, .95), transparent 25%),
                radial-gradient(circle at 90% 16%, rgba(255, 209, 216, .30), transparent 24%),
                radial-gradient(circle at 82% 72%, rgba(255, 255, 255, .88), transparent 28%),
                var(--planner-bg);
            color: var(--planner-text);
            overflow-x: hidden;
        }

        /* ---------------------------------------------------------
           Header
        --------------------------------------------------------- */

        body header {
            position: sticky;
            top: 0;
            z-index: 2000;
            border-bottom: 1px solid rgba(255,255,255,.52) !important;
            background: rgba(255,255,255,.72) !important;
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            box-shadow:
                0 8px 30px rgba(0,0,0,.045),
                inset 0 1px 0 rgba(255,255,255,.78);
        }

        body header .logo {
            font-weight: 650;
            letter-spacing: -.02em;
        }

        body header nav a {
            transition:
                color .25s ease,
                opacity .25s ease;
        }

        body header nav a:hover {
            color: var(--planner-red);
        }

        body header select {
            border: 1px solid rgba(0,0,0,.07);
            border-radius: 999px;
            background: rgba(255,255,255,.68);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.82),
                0 4px 16px rgba(0,0,0,.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        /* ---------------------------------------------------------
           Page / Title
        --------------------------------------------------------- */

        .planner-page {
            width: min(1320px, calc(100% - 40px));
            margin: 0 auto;
            padding: 84px 0 120px;
        }

        .planner-header {
            padding: 44px 0 64px;
            text-align: center;
        }

        .planner-header::before {
            content: "PLAN YOUR JOURNEY";
            display: block;
            margin-bottom: 18px;
            color: var(--planner-red);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .22em;
        }

        .planner-header h1 {
            margin: 0;
            font-size: clamp(46px, 7vw, 88px);
            line-height: 1.04;
            letter-spacing: -.06em;
            font-weight: 620;
        }

        .planner-header p {
            max-width: 720px;
            margin: 26px auto 0;
            color: var(--planner-soft-gray);
            font-size: clamp(16px, 1.8vw, 20px);
            line-height: 1.85;
        }

        /* ---------------------------------------------------------
           Glass sections
        --------------------------------------------------------- */

        .planner-page > section:not(.planner-header) {
            margin-top: 24px;
            padding: 28px;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 30px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.76),
                    rgba(255,255,255,.42)
                );
            box-shadow:
                0 18px 50px rgba(0,0,0,.055),
                inset 0 1px 0 rgba(255,255,255,.82);
            backdrop-filter: blur(24px) saturate(1.18);
            -webkit-backdrop-filter: blur(24px) saturate(1.18);
        }

        .planner-page h2 {
            margin: 0 0 24px;
            font-size: clamp(25px, 3vw, 36px);
            letter-spacing: -.045em;
            line-height: 1.2;
            font-weight: 650;
        }

        /* ---------------------------------------------------------
           Search
        --------------------------------------------------------- */

        .planner-search {
            display: flex;
            justify-content: center;
            padding: 6px;
        }

        .planner-search-input {
            width: min(760px, 100%);
            min-height: 60px;
            padding: 0 24px;
            border: 1px solid rgba(255,255,255,.75);
            border-radius: 22px;
            outline: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.82),
                    rgba(255,255,255,.54)
                );

            color: var(--planner-text);
            font: inherit;
            font-size: 16px;

            box-shadow:
                0 10px 30px rgba(0,0,0,.05),
                inset 0 1px 0 rgba(255,255,255,.9);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            transition:
                border-color .25s ease,
                box-shadow .25s ease,
                transform .25s ease;
        }

        .planner-search-input:focus {
            border-color: rgba(196,0,24,.30);
            box-shadow:
                0 14px 38px rgba(0,0,0,.07),
                0 0 0 4px rgba(196,0,24,.07),
                inset 0 1px 0 rgba(255,255,255,.92);
            transform: translateY(-1px);
        }

        /* ---------------------------------------------------------
           Categories
        --------------------------------------------------------- */

        .category-window {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 92px;
            padding: 18px 24px !important;
            box-sizing: border-box;
        }

        .category-section {
            width: fit-content;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,.62);
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255,255,255,.60), rgba(255,255,255,.30));
            box-shadow:
                0 10px 28px rgba(0,0,0,.055),
                inset 0 1px 0 rgba(255,255,255,.88),
                inset 0 -1px 0 rgba(255,255,255,.12);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
        }

        .category-button {
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid rgba(255,255,255,.68);
            border-radius: 999px;
            background: rgba(255,255,255,.56);
            color: #46464a;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.86),
                0 5px 14px rgba(0,0,0,.035);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            transition:
                transform .22s ease,
                background .22s ease,
                color .22s ease,
                box-shadow .22s ease;
        }

        .category-button:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.80);
        }

        .category-button.active {
            background: var(--planner-text) !important;
            color: #fff !important;
            box-shadow:
                0 10px 24px rgba(0,0,0,.12),
                inset 0 1px 0 rgba(255,255,255,.08);
        }


        /* ---------------------------------------------------------
           MAP-FIRST LAYOUT
           PCでは地図を右側に固定表示して、
           スクロールして地図を探さなくてよい構成にする。
        --------------------------------------------------------- */

        .planner-page {
            width: min(94vw, 1560px);
            max-width: 1560px;
        }

        .planner-workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
            gap: 26px;
            align-items: start;
        }

        .planner-workspace > .planner-spot-panel {
            min-width: 0;
        }

        .planner-workspace > .planner-map-panel {
            position: sticky;
            top: 88px;
            min-width: 0;
        }

        .planner-workspace > .planner-map-panel .planner-map-section {
            margin-top: 0 !important;
            height: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .planner-workspace > .planner-map-panel #map {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            min-height: 0;
            flex: none;
        }

        .planner-spot-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .planner-spot-panel > section {
            margin-top: 0 !important;
        }

        .planner-spot-panel > section:first-child {
            margin-top: 0 !important;
        }

        .planner-spot-panel .planner-search,
        .planner-spot-panel .category-section {
            width: 100%;
        }

        /* Map header is kept compact because the map itself is always visible. */
        .planner-map-panel .planner-map-section > h2 {
            margin-bottom: 16px;
        }

        /* The route result remains below the workspace. */
        .planner-after-workspace {
            margin-top: 24px;
        }

        @media (max-width: 1000px) {
            .planner-page {
                width: min(94vw, 900px);
            }

            .planner-workspace {
                grid-template-columns: 1fr;
            }

            .planner-workspace > .planner-map-panel {
                position: static;
            }

            .planner-workspace > .planner-map-panel .planner-map-section {
                height: auto;
                min-height: 0;
            }

            .planner-workspace > .planner-map-panel #map {
                width: min(100%, 760px);
                aspect-ratio: 1 / 1;
                height: auto;
                min-height: 0;
                margin: 0 auto;
            }
        }

        /* ---------------------------------------------------------
           Liquid Glass windows
        --------------------------------------------------------- */

        .planner-spot-panel > section {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.72) !important;
            border-radius: 28px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.74),
                    rgba(255,255,255,.40)
                );
            box-shadow:
                0 16px 42px rgba(0,0,0,.055),
                inset 0 1px 0 rgba(255,255,255,.86);
            backdrop-filter: blur(24px) saturate(1.18);
            -webkit-backdrop-filter: blur(24px) saturate(1.18);
        }

        .planner-spot-panel > section::before,
        .planner-map-section::before,
        .route-info::before,
        .planner-actions::before {
            pointer-events: none;
        }

        .spot-list-window {
            padding: 28px 24px 22px !important;
        }

        .spot-list-window h2 {
            position: sticky;
            top: 0;
            z-index: 2;
            margin: -2px 0 18px !important;
            padding: 2px 0 4px;
            background: linear-gradient(
                to bottom,
                rgba(246,246,248,.88),
                rgba(246,246,248,.62),
                rgba(246,246,248,0)
            );
        }

        .spot-list-window #spotList {
            max-height: 700px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 4px 10px 10px 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(196,0,24,.28) transparent;
        }

        .spot-list-window #spotList::-webkit-scrollbar {
            width: 8px;
        }

        .spot-list-window #spotList::-webkit-scrollbar-track {
            background: transparent;
        }

        .spot-list-window #spotList::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(196,0,24,.28);
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .spot-list-window #spotList::-webkit-scrollbar-thumb:hover {
            background: rgba(196,0,24,.48);
            background-clip: padding-box;
        }

        .planner-map-section,
        .selected-section,
        .route-info,
        .planner-actions {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.72) !important;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.74),
                    rgba(255,255,255,.40)
                ) !important;
            box-shadow:
                0 16px 42px rgba(0,0,0,.055),
                inset 0 1px 0 rgba(255,255,255,.86) !important;
            backdrop-filter: blur(24px) saturate(1.18);
            -webkit-backdrop-filter: blur(24px) saturate(1.18);
        }

        .planner-map-section::after,
        .selected-section::after,
        .route-info::after,
        .planner-actions::after,
        .spot-list-window::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.20),
                    transparent 32%
                );
        }

        .planner-map-section > *,
        .selected-section > *,
        .route-info > *,
        .planner-actions > *,
        .spot-list-window > * {
            position: relative;
            z-index: 1;
        }

        /* ---------------------------------------------------------
           Spot grid
        --------------------------------------------------------- */

        #spotList {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .planner-spot {
            position: relative;
            overflow: hidden;
            min-width: 0;
            padding: 0;
            border: 1px solid rgba(255,255,255,.72) !important;
            border-radius: 26px !important;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.76),
                    rgba(255,255,255,.42)
                ) !important;

            box-shadow:
                0 16px 42px rgba(0,0,0,.05),
                inset 0 1px 0 rgba(255,255,255,.86) !important;

            backdrop-filter: blur(20px) saturate(1.14);
            -webkit-backdrop-filter: blur(20px) saturate(1.14);

            cursor: pointer;
            transform: translateY(0);
            transition:
                transform .28s cubic-bezier(.16,1,.3,1),
                box-shadow .28s ease,
                border-color .28s ease;
        }

        .planner-spot:hover {
            transform: translateY(-6px) !important;
            box-shadow:
                0 24px 56px rgba(0,0,0,.09),
                inset 0 1px 0 rgba(255,255,255,.9) !important;
        }

        .planner-spot.selected {
            border-color: rgba(196,0,24,.38) !important;
            box-shadow:
                0 20px 52px rgba(196,0,24,.09),
                0 0 0 2px rgba(196,0,24,.08),
                inset 0 1px 0 rgba(255,255,255,.92) !important;
        }

        .planner-spot::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.28),
                    transparent 38%
                );
        }

        .spot-image {
            display: block;
            width: 100%;
            height: 250px;
            margin: 0 !important;
            object-fit: cover;
            border-radius: 0 !important;
            transition: transform .8s cubic-bezier(.16,1,.3,1);
        }

        .planner-spot:hover .spot-image {
            transform: scale(1.035);
        }

        .spot-content {
            padding: 24px;
        }

        .spot-content h3 {
            margin: 0 0 10px;
            color: var(--planner-text) !important;
            font-size: 25px !important;
            letter-spacing: -.035em;
        }

        .spot-category {
            display: inline-flex !important;
            align-items: center;
            min-height: 30px;
            padding: 0 12px !important;
            margin: 0 0 12px !important;
            border: 1px solid rgba(0,0,0,.05);
            border-radius: 999px !important;
            background: rgba(245,245,247,.78) !important;
            color: #6e6e73;
            font-size: 12px !important;
        }

        .spot-content > p:not(.spot-category):not(.spot-time) {
            position: relative;
            margin: 18px 0 0 !important;
            padding: 14px 16px 14px 17px;
            border: 1px solid rgba(0,0,0,.045);
            border-left: 3px solid rgba(196,0,24,.72);
            border-radius: 16px;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.72),
                    rgba(245,245,247,.58)
                );
            color: #666;
            font-size: 14px;
            line-height: 1.8;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.80);
        }

        .spot-content > p:not(.spot-category):not(.spot-time)::before {
            content: "ABOUT";
            display: block;
            margin-bottom: 5px;
            color: rgba(196,0,24,.70);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .16em;
        }

        .spot-time {
            margin: 15px 0 0 !important;
            color: var(--planner-red);
            font-size: 14px;
            font-weight: 650;
        }

        .selected-label {
            display: inline-flex !important;
            align-items: center;
            margin-top: 15px !important;
            padding: 7px 12px !important;
            border-radius: 999px !important;
            background: var(--planner-red) !important;
            color: #fff !important;
            font-size: 12px !important;
            font-weight: 700;
            box-shadow: 0 7px 16px rgba(196,0,24,.18);
        }

        .spot-url {
            display: inline-block;
            margin-top: 15px;
            color: var(--planner-red) !important;
            font-size: 13px;
            text-decoration: none;
            font-weight: 700;
        }

        .spot-url:hover {
            text-decoration: underline;
        }

        /* ---------------------------------------------------------
           Selected route
        --------------------------------------------------------- */

        .selected-section {
            position: relative;
        }

        #selectedSpots {
            min-height: 90px;
        }

        #selectedList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #selectedList > p {
            margin: 0;
            padding: 24px;
            border-radius: 20px;
            background: rgba(245,245,247,.70);
            color: var(--planner-gray);
            text-align: center;
        }

        .selected-spot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 16px 14px 20px;
            border: 1px solid rgba(255,255,255,.72);
            border-radius: 18px;
            background: rgba(255,255,255,.58);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.86),
                0 7px 18px rgba(0,0,0,.035);
        }

        .selected-spot > span {
            color: #2c2c2f;
            font-size: 15px;
            font-weight: 650;
        }

        .selected-spot button {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            border: 0;
            border-radius: 50%;
            background: rgba(0,0,0,.055);
            color: #555;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            transition:
                transform .2s ease,
                background .2s ease,
                color .2s ease;
        }

        .selected-spot button:hover {
            transform: rotate(6deg) scale(1.06);
            background: rgba(196,0,24,.10);
            color: var(--planner-red);
        }

        /* ---------------------------------------------------------
           Map
        --------------------------------------------------------- */

        .planner-map-section {
            padding: 28px !important;
        }

        .planner-map-section > h2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #map {
            width: 100%;
            height: 600px;
            border-radius: 26px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.65);
            box-shadow:
                0 18px 45px rgba(0,0,0,.08),
                inset 0 1px 0 rgba(255,255,255,.8);
        }

        .leaflet-container {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: rgba(255,255,255,.92);
            box-shadow: 0 18px 40px rgba(0,0,0,.10);
        }

        .leaflet-popup-content-wrapper {
            border: 1px solid rgba(255,255,255,.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .planner-map-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .planner-map-buttons button,
        .planner-actions button {
            min-height: 50px;
            padding: 0 20px;
            border: 1px solid rgba(255,255,255,.62);
            border-radius: 999px;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.72),
                    rgba(255,255,255,.44)
                );
            color: #202023;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.84),
                0 8px 20px rgba(0,0,0,.05);
            backdrop-filter: blur(18px) saturate(1.15);
            -webkit-backdrop-filter: blur(18px) saturate(1.15);
            cursor: pointer;
            transition:
                transform .22s ease,
                background .22s ease,
                box-shadow .22s ease,
                color .22s ease;
        }

        .planner-map-buttons button:hover,
        .planner-actions button:hover {
            transform: translateY(-2px);
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.90),
                    rgba(255,255,255,.62)
                );
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.92),
                0 14px 30px rgba(0,0,0,.08);
        }

        #createRouteBtn {
            background: var(--planner-text);
            color: #fff;
            border-color: rgba(255,255,255,.12);
            box-shadow:
                0 12px 26px rgba(0,0,0,.13),
                inset 0 1px 0 rgba(255,255,255,.12);
        }

        #createRouteBtn:hover {
            background: var(--planner-red);
        }

        #clearBtn:hover {
            color: var(--planner-red);
        }

        /* ---------------------------------------------------------
           Route info
        --------------------------------------------------------- */

        .route-info {
            position: relative;
            overflow: hidden;
        }

        .route-info::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            right: -100px;
            top: -100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196,0,24,.08), transparent 70%);
            pointer-events: none;
        }

        .route-info-content {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .route-info-content p {
            margin: 0;
            padding: 22px 18px;
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 20px;
            background: rgba(255,255,255,.52);
            text-align: center;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.84),
                0 7px 18px rgba(0,0,0,.03);
            color: #68686d;
            font-size: 13px;
        }

        .route-info-content span:last-child {
            display: block;
            margin-top: 7px;
            color: var(--planner-text);
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -.03em;
        }

    <!-- =========================================================
         Liquid Glass Cursor
         ========================================================= -->

    <script>
        (() => {
            const cursor = document.querySelector(".liquid-cursor");
            if (!cursor) return;

            const finePointer = window.matchMedia("(pointer: fine)");
            if (!finePointer.matches) return;

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let currentX = mouseX;
            let currentY = mouseY;
            let visible = false;

            function moveCursor(event) {
                mouseX = event.clientX;
                mouseY = event.clientY;

                if (!visible) {
                    currentX = mouseX;
                    currentY = mouseY;
                    visible = true;
                    cursor.classList.add("is-visible");
                }
            }

            function animate() {
                currentX += (mouseX - currentX) * 0.18;
                currentY += (mouseY - currentY) * 0.18;

                cursor.style.transform =
                    `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%)`;

                requestAnimationFrame(animate);
            }

            function isInteractive(target) {
                return target.closest(
                    "a, button, select, input, textarea, .leaflet-interactive, .leaflet-control"
                );
            }

            document.addEventListener("mousemove", moveCursor);

            document.addEventListener("mouseover", event => {
                if (isInteractive(event.target)) {
                    cursor.classList.add("is-hover");
                }
            });

            document.addEventListener("mouseout", event => {
                if (isInteractive(event.target)) {
                    cursor.classList.remove("is-hover");
                }
            });

            document.addEventListener("mousedown", event => {
                cursor.classList.add("is-down");

                const ripple = document.createElement("span");
                ripple.className = "cursor-ripple";
                ripple.style.left = `${event.clientX}px`;
                ripple.style.top = `${event.clientY}px`;

                document.body.appendChild(ripple);

                ripple.addEventListener(
                    "animationend",
                    () => ripple.remove(),
                    { once: true }
                );
            });

            document.addEventListener("mouseup", () => {
                cursor.classList.remove("is-down");
            });

            document.addEventListener("mouseleave", () => {
                visible = false;
                cursor.classList.remove("is-visible");
            });

            document.addEventListener("mouseenter", () => {
                visible = true;
                cursor.classList.add("is-visible");
            });

            animate();
        })();
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const links = document.querySelectorAll("body > header nav a");
            const file = window.location.pathname.split("/").pop() || "home.html";
            links.forEach(function (link) {
                const href = (link.getAttribute("href") || "").split("/").pop();
                if (href === file || (file === "" && href === "home.html")) {
                    link.classList.add("nav-active");
                    link.setAttribute("aria-current", "page");
                }
            });

            const cursor = document.querySelector(".liquid-cursor");
            if (!cursor || !window.matchMedia("(pointer: fine)").matches) return;

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let currentX = mouseX;
            let currentY = mouseY;
            let visible = false;

            function moveCursor(event) {
                mouseX = event.clientX;
                mouseY = event.clientY;
                if (!visible) {
                    currentX = mouseX;
                    currentY = mouseY;
                    visible = true;
                    cursor.classList.add("is-visible");
                }
            }

            function animate() {
                currentX += (mouseX - currentX) * 0.18;
                currentY += (mouseY - currentY) * 0.18;
                cursor.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%)`;
                requestAnimationFrame(animate);
            }

            function isInteractive(target) {
                return target.closest("a, button, select, input, textarea, .leaflet-interactive, .leaflet-control");
            }

            document.addEventListener("mousemove", moveCursor);
            document.addEventListener("mouseover", event => {
                if (isInteractive(event.target)) cursor.classList.add("is-hover");
            });
            document.addEventListener("mouseout", event => {
                if (isInteractive(event.target)) cursor.classList.remove("is-hover");
            });
            document.addEventListener("mousedown", event => {
                cursor.classList.add("is-down");
                const ripple = document.createElement("span");
                ripple.className = "cursor-ripple";
                ripple.style.left = `${event.clientX}px`;
                ripple.style.top = `${event.clientY}px`;
                document.body.appendChild(ripple);
                ripple.addEventListener("animationend", () => ripple.remove(), { once: true });
            });
            document.addEventListener("mouseup", () => cursor.classList.remove("is-down"));
            document.addEventListener("mouseleave", () => {
                visible = false;
                cursor.classList.remove("is-visible");
            });
            document.addEventListener("mouseenter", () => {
                visible = true;
                cursor.classList.add("is-visible");
            });
            animate();
        });
    </script>

</body>
