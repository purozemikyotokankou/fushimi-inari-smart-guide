<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="伏見稲荷スマートガイドの地図・徒歩ナビゲーション">
  <title>伏見稲荷スマートガイド | 地図・ルート案内</title>
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@6.18.0/dist/maplibre-gl.css';">
  <link rel="stylesheet" href="css/planner-maplibre.css?v=155">
  <script src="js/carto-config.js?v=155" defer></script>
  <script src="js/planner-maplibre.js?v=155" defer></script>
  <style id="planner-v155-legacy-category-bar">
    /* V155: Plan C MapLibre map is the only map renderer. The legacy category bar is the only old UI retained. */
    .maplibre-category-rail { display:none !important; }
    .maplibre-controls {
      top:calc(max(10px, env(safe-area-inset-top)) + 140px) !important;
    }
    #plannerCategoryTray {
      position:absolute;
      z-index:32;
      top:calc(max(10px, env(safe-area-inset-top)) + 59px);
      left:50%;
      width:max-content;
      max-width:calc(100% - 18px);
      height:72px;
      padding:3px 5px;
      overflow-x:auto;
      overflow-y:hidden;
      transform:translateX(-50%);
      border:1px solid rgba(255,255,255,.94);
      border-radius:27px;
      background:rgba(231,233,234,.88);
      box-shadow:0 9px 27px rgba(20,30,24,.15),inset 0 1px 0 rgba(255,255,255,.98);
      backdrop-filter:blur(27px) saturate(1.42);
      -webkit-backdrop-filter:blur(27px) saturate(1.42);
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }
    #plannerCategoryTray::-webkit-scrollbar { display:none; }
    #plannerCategoryTray .planner-category-grid {
      display:flex;
      flex-flow:row nowrap;
      align-items:center;
      gap:2px;
      width:max-content;
      min-width:0;
      height:64px;
      margin:0;
      padding:0;
    }
    #plannerCategoryTray .category-button {
      --category-accent:#7F878F;
      position:relative;
      display:flex;
      flex:0 0 64px;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:3px;
      width:64px;
      min-width:64px;
      height:62px;
      min-height:62px;
      margin:0;
      padding:4px 2px;
      border:1px solid transparent;
      border-radius:15px;
      background:transparent;
      box-shadow:none;
      color:var(--category-accent);
      font:inherit;
      font-size:9px;
      font-weight:750;
      line-height:1.15;
      text-align:center;
      white-space:normal;
      cursor:pointer;
      transition:background .18s ease,border-color .18s ease,box-shadow .18s ease;
      -webkit-tap-highlight-color:transparent;
    }
    #plannerCategoryTray .category-button::before,
    #plannerCategoryTray .category-button::after { content:none; display:none; }
    #plannerCategoryTray .category-button:hover { background:rgba(255,255,255,.45); }
    #plannerCategoryTray .category-button.active,
    #plannerCategoryTray .category-button.is-active {
      background:rgba(255,255,255,.96);
      border-color:rgba(255,255,255,.98);
      box-shadow:0 3px 9px rgba(28,39,32,.10),inset 0 1px 0 #fff;
      color:var(--category-accent);
    }
    #plannerCategoryTray .category-glyph-image {
      display:block;
      flex:0 0 26px;
      width:26px;
      min-width:26px;
      height:26px;
      min-height:26px;
      padding:0;
      margin:0;
      border:0;
      border-radius:0;
      background-color:var(--category-accent);
      background-image:none;
      -webkit-mask-image:var(--category-mask);
      mask-image:var(--category-mask);
      -webkit-mask-repeat:no-repeat;
      mask-repeat:no-repeat;
      -webkit-mask-position:center;
      mask-position:center;
      -webkit-mask-size:contain;
      mask-size:contain;
    }
    #plannerCategoryTray [data-category="all"] { --category-accent:#FF2800; }
    #plannerCategoryTray [data-category="sightseeing"] { --category-accent:#9A0079; }
    #plannerCategoryTray .food-category-trigger,
    #plannerCategoryTray [data-food-filter="eat"],
    #plannerCategoryTray [data-food-filter="buy"] { --category-accent:#FF9900; }
    #plannerCategoryTray [data-category="交通"] { --category-accent:#0041FF; }
    #plannerCategoryTray [data-category="施設"] { --category-accent:#35A16B; }
    #plannerCategoryTray .food-category-switcher {
      position:relative;
      display:block;
      flex:0 0 66px;
      width:66px;
      min-width:66px;
      height:64px;
      overflow:hidden;
      transition:flex-basis .26s cubic-bezier(.2,.75,.25,1),width .26s cubic-bezier(.2,.75,.25,1);
    }
    #plannerCategoryTray .food-category-switcher.is-open {
      flex-basis:202px;
      width:202px;
    }
    #plannerCategoryTray .food-category-front-face,
    #plannerCategoryTray .food-category-options {
      position:absolute;
      top:0;
      left:0;
      display:flex;
      align-items:center;
      height:64px;
      margin:0;
      padding:0;
    }
    #plannerCategoryTray .food-category-front-face { width:66px; }
    #plannerCategoryTray .food-category-options {
      width:202px;
      justify-content:flex-start;
      gap:2px;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transform:translateX(12px);
      transition:opacity .16s ease,transform .22s ease,visibility .22s ease;
    }
    #plannerCategoryTray .food-category-switcher.is-open .food-category-front-face {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }
    #plannerCategoryTray .food-category-switcher.is-open .food-category-options {
      opacity:1;
      visibility:visible;
      pointer-events:auto;
      transform:translateX(0);
    }
    #plannerCategoryTray .food-category-options .category-button { flex-basis:64px; width:64px; min-width:64px; }
    #plannerCategoryTray .food-close-button { --category-accent:#7F878F; }
    #plannerCategoryTray .category-label { display:block; max-width:100%; }

    /* MapLibre owns marker positioning. Do not animate its transform: that transform is the geographic screen position. */
    #smartMap .custom-spot-marker {
      transition:none !important;
      will-change:transform;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }
    #smartMap .custom-spot-marker.is-selected {
      outline:2px solid #FF9900;
      outline-offset:2px;
      box-shadow:0 2px 10px rgba(0,0,0,.32),0 0 0 3px rgba(255,153,0,.14);
    }
    .maplibre-map-failure a { text-decoration:underline; }
    @media (max-width:520px) {
      #plannerCategoryTray {
        top:calc(max(10px, env(safe-area-inset-top)) + 55px);
        height:68px;
        max-width:calc(100% - 14px);
        padding:2px 4px;
        border-radius:23px;
      }
      #plannerCategoryTray .planner-category-grid { height:62px; }
      #plannerCategoryTray .category-button { flex-basis:59px; width:59px; min-width:59px; height:58px; min-height:58px; font-size:8px; }
      #plannerCategoryTray .food-category-switcher { flex-basis:61px; width:61px; height:60px; }
      #plannerCategoryTray .food-category-switcher.is-open { flex-basis:188px; width:188px; }
      #plannerCategoryTray .food-category-front-face { width:61px; height:60px; }
      #plannerCategoryTray .food-category-options { width:188px; height:60px; }
      #plannerCategoryTray .food-category-options .category-button { flex-basis:60px; width:60px; min-width:60px; }
      .maplibre-controls { top:calc(max(10px, env(safe-area-inset-top)) + 128px) !important; }
    }
    @media (prefers-reduced-motion:reduce) {
      #plannerCategoryTray .food-category-switcher,
      #plannerCategoryTray .food-category-options { transition-duration:.01ms !important; }
    }
  </style>
  <link rel="stylesheet" href="css/planner-google-ux.css?v=155">
  <script src="js/planner-google-ux.js?v=155" defer></script>
</head>
<body class="maplibre-page">
  <main class="maplibre-shell">
    <div id="smartMap" class="smart-map" aria-label="伏見稲荷の地図"></div>

    <header class="maplibre-topbar">
      <a class="maplibre-back" href="home.html" aria-label="ホームへ戻る" title="ホームへ戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="maplibre-search-wrap">
        <svg class="search-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2"/></svg>
        <input id="destinationSearch" type="search" autocomplete="off" placeholder="スポット・場所を検索" aria-label="スポット・場所を検索">
        <button id="clearSearch" class="search-clear" type="button" aria-label="検索を消去" hidden>×</button>
        <div id="searchResults" class="maplibre-search-results" hidden></div>
      </div>
      <select id="mapLanguage" class="maplibre-language" aria-label="表示言語">
        <option value="ja">日本語</option>
        <option value="en">EN</option>
        <option value="zh">中文</option>
        <option value="ko">한국어</option>
      </select>
    </header>

    <!-- Legacy planner category bar: only this UI is carried over from the old planner. -->
    <nav id="plannerCategoryTray" class="planner-category-tray" aria-label="スポットの種類">
      <div class="planner-category-grid planner-category-main-grid">
        <button type="button" class="category category-button map-category active is-active" data-category="all" data-filter="all" aria-pressed="true">
          <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-all.svg')" aria-hidden="true"></span>
          <span class="category-label" data-category-label="all">すべて</span>
        </button>
        <button type="button" class="category category-button map-category" data-category="sightseeing" data-filter="sightseeing" aria-pressed="false">
          <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-sightseeing.svg')" aria-hidden="true"></span>
          <span class="category-label" data-category-label="sightseeing">見どころ</span>
        </button>
        <div class="food-category-switcher planner-category-deck" id="foodCategorySwitcher" data-face="categories">
          <div class="food-category-front-face">
            <button type="button" class="category-button food-category-trigger" id="foodCategoryTrigger" aria-expanded="false" aria-controls="foodCategoryOptions" aria-label="食べる・買うを選ぶ">
              <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-food-shop.svg')" aria-hidden="true"></span>
              <span class="category-label" data-category-label="foodShop">食べる・買う</span>
            </button>
          </div>
          <div class="food-category-options" id="foodCategoryOptions" aria-hidden="true">
            <button type="button" class="category-button food-close-button" id="foodCategoryClose" aria-label="閉じる">
              <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-back.svg')" aria-hidden="true"></span>
              <span class="category-label" data-category-label="back">閉じる</span>
            </button>
            <button type="button" class="category category-button food-option food-choice-button map-category" data-category="グルメ" data-food-filter="eat" data-filter="food" aria-pressed="false">
              <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-food.svg')" aria-hidden="true"></span>
              <span class="category-label" data-category-label="food">食べる</span>
            </button>
            <button type="button" class="category category-button food-option food-choice-button map-category" data-category="グルメ" data-food-filter="buy" data-filter="buy" aria-pressed="false">
              <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-buy.svg')" aria-hidden="true"></span>
              <span class="category-label" data-category-label="buy">買う</span>
            </button>
          </div>
        </div>
        <button type="button" class="category category-button map-category" data-category="交通" data-filter="transport" aria-pressed="false">
          <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-transport.svg')" aria-hidden="true"></span>
          <span class="category-label" data-category-label="transport">交通</span>
        </button>
        <button type="button" class="category category-button map-category" data-category="施設" data-filter="toilet" aria-pressed="false">
          <span class="category-glyph category-glyph-image" style="--category-mask:url('./images/icons/category-facilities.svg')" aria-hidden="true"></span>
          <span class="category-label" data-category-label="facilities">施設</span>
        </button>
      </div>
    </nav>

    <div class="maplibre-controls" aria-label="地図操作">
      <button id="zoomInMap" class="maplibre-control zoom-control" type="button" aria-label="拡大" title="拡大"><span class="zoom-glyph">+</span></button>
      <button id="zoomOutMap" class="maplibre-control zoom-control" type="button" aria-label="縮小" title="縮小"><span class="zoom-glyph">−</span></button>
      <button id="tiltMap" class="maplibre-control" type="button" aria-label="地図を傾ける" title="2D / 3D">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
        <span>3D</span>
      </button>
      <button id="compassMap" class="maplibre-control compass-control" type="button" aria-label="北を上にする" title="北を上にする">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="compass-north" d="m12 2 4 10-4-2-4 2 4-10Z"/><path d="m12 22-4-10 4 2 4-2-4 10Z"/></svg>
      </button>
      <button id="locateMap" class="maplibre-control" type="button" aria-label="現在地" title="現在地">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>

    <div id="maplibreStatus" class="maplibre-status" role="status" aria-live="polite">地図を準備しています…</div>

    <section id="maplibreMapFailure" class="maplibre-map-failure" role="alert" hidden>
      <strong>地図を表示できませんでした</strong>
      <p id="maplibreMapFailureText">通信状況を確認して、もう一度お試しください。</p>
      <div class="maplibre-map-failure-actions">
        <button id="retryMapLoad" type="button">もう一度読み込む</button>
        <a href="home.html">ホームへ戻る</a>
      </div>
    </section>

    <section id="guidanceCard" class="guidance-card" hidden aria-live="polite">
      <div class="guidance-kicker" id="guidanceKicker">次の案内</div>
      <strong id="guidanceInstruction">ルートに沿って進んでください</strong>
      <div class="guidance-meta"><span id="guidanceDistance">-- m</span><span id="guidanceRoad">参道</span></div>
    </section>

    <aside id="maplibreSheet" class="maplibre-sheet" aria-label="スポットとルートの情報">
      <button id="sheetHandle" class="maplibre-sheet-handle" type="button" aria-label="パネルを開閉" aria-expanded="false"><span></span></button>
      <div class="maplibre-sheet-inner">
        <div id="explorePanel" class="explore-panel">
          <div class="sheet-heading-row">
            <div><p class="sheet-eyebrow">FUSHIMI INARI · SMART GUIDE</p><h1 id="exploreHeading">伏見稲荷を探索</h1></div>
            <span class="maplibre-beta-tag">SMART MAP</span>
          </div>
          <p id="exploreIntro" class="explore-intro">スポットを選ぶと、参道に沿った徒歩ルートを検索できます。</p>
          <div id="nearbySpotList" class="nearby-spot-list"></div>
        </div>

        <section id="spotPanel" class="spot-panel" hidden>
          <div class="spot-panel-top">
            <img id="spotPhoto" class="spot-panel-photo" alt="" hidden>
            <div class="spot-panel-copy">
              <div id="spotCategoryLabel" class="spot-panel-category"></div>
              <h2 id="spotPanelName"></h2>
              <p id="spotPanelDescription"></p>
            </div>
            <button id="closeSpotPanel" class="sheet-close" type="button" aria-label="閉じる">×</button>
          </div>
          <div class="spot-panel-actions">
            <button id="routeToSpot" class="primary-action" type="button">ここへ行く</button>
            <button id="saveSpotButton" class="secondary-action save-spot-action" type="button" aria-pressed="false">☆ 保存</button>
          </div>
        </section>

        <section id="routePanel" class="route-panel" hidden>
          <div class="route-panel-title-row">
            <div><p class="sheet-eyebrow" id="routeKicker">徒歩ルート</p><h2 id="routeDestinationTitle">目的地</h2></div>
            <button id="closeRoutePanel" class="sheet-close" type="button" aria-label="閉じる">×</button>
          </div>
          <div id="routeOptions" class="route-options"></div>
          <div class="route-summary">
            <div><strong id="routeEta">--分</strong><span id="routeEtaLabel">徒歩</span></div>
            <div><strong id="routeDistance">-- m</strong><span id="routeDistanceLabel">距離</span></div>
            <div><strong id="routeArrival">--:--</strong><span id="routeArrivalLabel">到着予定</span></div>
          </div>
          <p id="routeQualityNote" class="route-quality-note"></p>
          <p id="routeEtaDisclaimer" class="route-eta-disclaimer">到着予定は標準的な歩行速度から算出した目安です。階段・坂道・混雑・休憩時間は反映されません。</p>
          <div class="route-panel-actions">
            <button id="startNavigation" class="primary-action" type="button">ナビを開始</button>
          </div>
        </section>

        <section id="activeNavigationPanel" class="active-navigation-panel" hidden>
          <div class="active-nav-stats"><div><strong id="navRemaining">-- m</strong><span id="navRemainingLabel">残り距離</span></div><div><strong id="navArrivalTime">--:--</strong><span id="navArrivalTimeLabel">到着予定</span></div></div>
          <div class="active-nav-actions">
            <button id="toggleVoice" class="secondary-action" type="button" aria-pressed="true">音声案内 ON</button>
            <button id="stopNavigation" class="stop-action" type="button">ナビを終了</button>
          </div>
          <p id="navStatusText" class="nav-status-text" role="status"></p>
        </section>

        <div id="maplibreError" class="maplibre-error" role="alert" hidden></div>
      </div>
    </aside>
  </main>

  <script>
    (() => {
      const tray = document.getElementById('plannerCategoryTray');
      const switcher = document.getElementById('foodCategorySwitcher');
      const trigger = document.getElementById('foodCategoryTrigger');
      const options = document.getElementById('foodCategoryOptions');
      const closeButton = document.getElementById('foodCategoryClose');
      const language = document.getElementById('mapLanguage');
      if (!tray || !switcher || !trigger || !options || !language) return;
      try {
        const savedLanguage = localStorage.getItem('language');
        if (['ja','en','zh','ko'].includes(savedLanguage)) language.value = savedLanguage;
      } catch (_) { /* Keep the default language if storage is unavailable. */ }

      const labels = {
        all: {ja:'すべて',en:'All',zh:'全部',ko:'전체'},
        sightseeing: {ja:'見どころ',en:'Explore',zh:'景点',ko:'명소'},
        foodShop: {ja:'食べる・買う',en:'Eat & Shop',zh:'餐饮·购物',ko:'먹기·쇼핑'},
        back: {ja:'閉じる',en:'Back',zh:'返回',ko:'뒤로'},
        food: {ja:'食べる',en:'Eat',zh:'餐饮',ko:'먹기'},
        buy: {ja:'買う',en:'Shop',zh:'购物',ko:'쇼핑'},
        transport: {ja:'交通',en:'Transit',zh:'交通',ko:'교통'},
        facilities: {ja:'施設',en:'Facilities',zh:'设施',ko:'시설'}
      };
      const updateLabels = () => {
        const lang = ['ja','en','zh','ko'].includes(language.value) ? language.value : 'ja';
        tray.querySelectorAll('[data-category-label]').forEach(node => {
          const key = node.dataset.categoryLabel;
          node.textContent = labels[key]?.[lang] || labels[key]?.ja || key;
        });
      };
      const closeFoodOptions = () => {
        switcher.classList.remove('is-open');
        trigger.setAttribute('aria-expanded','false');
        options.setAttribute('aria-hidden','true');
      };
      trigger.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        const open = !switcher.classList.contains('is-open');
        switcher.classList.toggle('is-open',open);
        trigger.setAttribute('aria-expanded',String(open));
        options.setAttribute('aria-hidden',String(!open));
      });
      closeButton?.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        closeFoodOptions();
      });
      tray.querySelectorAll('.map-category').forEach(button => {
        button.addEventListener('click', () => {
          tray.querySelectorAll('.map-category').forEach(item => item.classList.remove('active'));
          button.classList.add('active');
          if (button.matches('.food-option')) trigger.classList.add('active');
          else trigger.classList.remove('active');
          closeFoodOptions();
        });
      });
      language.addEventListener('change',updateLabels);
      updateLabels();
    })();
  </script>
</body>
</html>
