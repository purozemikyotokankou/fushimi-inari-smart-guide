<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伏見稲荷スマートガイド｜ローリングテスト</title><style>
:root{color-scheme:light;--verm:#d8432e;--ink:#282b30;--muted:#737982}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fffaf5,#f4f0ea);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink)}header{padding:26px 22px 12px;text-align:center}h1{font-size:clamp(21px,4vw,30px);margin:0 0 7px;letter-spacing:.04em}header p{margin:0;color:var(--muted);font-size:13px}.grid{width:min(1000px,calc(100% - 28px));margin:22px auto 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:rgba(255,255,255,.82);border:1px solid rgba(130,100,80,.12);border-radius:22px;padding:16px;box-shadow:0 12px 35px rgba(50,35,20,.07);min-width:0}.stage{height:220px;border-radius:16px;background:radial-gradient(ellipse,#fff 0%,#fffaf5 58%,#f3ece4 100%);display:grid;place-items:center;overflow:hidden;position:relative}.name{font-size:16px;font-weight:750;margin:13px 0 4px}.desc{font-size:12px;color:var(--muted);line-height:1.6;min-height:38px}.choose{border:0;border-radius:999px;background:#30343a;color:#fff;padding:9px 15px;font-weight:700;cursor:pointer;margin-top:9px}.choose:focus-visible{outline:3px solid #e58a70;outline-offset:3px}.torii{width:34px;height:36px;background:linear-gradient(180deg,#f47b5f,#c93225);-webkit-mask:url('images/icons/category-sightseeing.svg') center/contain no-repeat;mask:url('images/icons/category-sightseeing.svg') center/contain no-repeat;filter:drop-shadow(0 3px 3px #9d382533)}
/* A: orbit */.a{position:relative;width:190px;height:160px}.a .torii{position:absolute;left:calc(50% - 17px);top:calc(50% - 18px);animation:orbit 3.4s linear infinite;animation-delay:calc(var(--i)*-.425s)}@keyframes orbit{0%,100%{transform:translate(0,-54px) scale(.55);opacity:.28}12.5%{transform:translate(38px,-38px) scale(.68);opacity:.45}25%{transform:translate(57px,0) scale(.82);opacity:.68}37.5%{transform:translate(38px,38px) scale(1);opacity:.9}50%{transform:translate(0,52px) scale(1.15);opacity:1}62.5%{transform:translate(-38px,38px) scale(1);opacity:.9}75%{transform:translate(-57px,0) scale(.82);opacity:.68}87.5%{transform:translate(-38px,-38px) scale(.68);opacity:.45}}
/* B: torii tunnel */.b{display:flex;align-items:center;justify-content:center;gap:7px;perspective:500px}.b .torii{animation:tunnel 1.7s ease-in-out infinite;animation-delay:calc(var(--i)*-.21s)}@keyframes tunnel{0%,100%{transform:translateY(-8px) scale(.55);opacity:.2}50%{transform:translateY(8px) scale(1.18);opacity:1}}
/* C: drawing/assembly */.c{width:180px;height:150px;position:relative}.c .torii{position:absolute;left:calc(50% - 17px);top:calc(50% - 18px);animation:assemble 1.8s cubic-bezier(.4,0,.2,1) infinite;animation-delay:calc(var(--i)*.12s)}@keyframes assemble{0%{transform:translate(var(--sx),var(--sy)) scale(.35) rotate(-12deg);opacity:0}45%,70%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--ex),var(--ey)) scale(.5);opacity:0}}
/* D: fox pictogram ring */.d{position:relative;width:170px;height:170px}.fox{position:absolute;left:calc(50% - 17px);top:calc(50% - 17px);width:34px;height:34px;fill:#d84a32;filter:drop-shadow(0 2px 2px #8e322522);animation:foxring 3.2s linear infinite;animation-delay:calc(var(--i)*-.4s)}@keyframes foxring{0%,100%{transform:translateY(-52px) scale(.55);opacity:.3}25%{transform:translateX(52px) scale(.85);opacity:.8}50%{transform:translateY(52px) scale(1.15);opacity:1}75%{transform:translateX(-52px) scale(.85);opacity:.8}}
footer{text-align:center;color:var(--muted);font-size:11px;padding:0 16px 26px}@media(max-width:620px){.grid{grid-template-columns:1fr}.stage{height:200px}}
</style></head><body><header><h1>伏見稲荷スマートガイド</h1><p>マップ読み込み用ローリング・デザインテスト</p></header><main class="grid">
<section class="card"><div class="stage"><div class="a"><i class="torii" style="--i:0"></i><i class="torii" style="--i:1"></i><i class="torii" style="--i:2"></i><i class="torii" style="--i:3"></i><i class="torii" style="--i:4"></i><i class="torii" style="--i:5"></i><i class="torii" style="--i:6"></i><i class="torii" style="--i:7"></i></div></div><div class="name">A — TORII LOOP</div><div class="desc">鳥居ピクトグラムが円形に巡回。奥行きと透明度で遠近感を表現。</div><button class="choose" data-choice="A — TORII LOOP">この案を選ぶ</button></section>
<section class="card"><div class="stage"><div class="b"><i class="torii" style="--i:0"></i><i class="torii" style="--i:1"></i><i class="torii" style="--i:2"></i><i class="torii" style="--i:3"></i><i class="torii" style="--i:4"></i><i class="torii" style="--i:5"></i><i class="torii" style="--i:6"></i></div></div><div class="name">B — 千本鳥居トンネル</div><div class="desc">鳥居が奥から手前へ流れる。参道をくぐり進むような演出。</div><button class="choose" data-choice="B — 千本鳥居トンネル">この案を選ぶ</button></section>
<section class="card"><div class="stage"><div class="c"><i class="torii" style="--i:0;--sx:-58px;--sy:-38px;--ex:58px;--ey:38px"></i><i class="torii" style="--i:1;--sx:-38px;--sy:-58px;--ex:38px;--ey:58px"></i><i class="torii" style="--i:2;--sx:0px;--sy:-62px;--ex:0px;--ey:62px"></i><i class="torii" style="--i:3;--sx:38px;--sy:-58px;--ex:-38px;--ey:58px"></i><i class="torii" style="--i:4;--sx:58px;--sy:-38px;--ex:-58px;--ey:38px"></i><i class="torii" style="--i:5;--sx:38px;--sy:38px;--ex:-38px;--ey:-38px"></i><i class="torii" style="--i:6;--sx:0px;--sy:58px;--ex:0px;--ey:-58px"></i><i class="torii" style="--i:7;--sx:-38px;--sy:38px;--ex:38px;--ey:-38px"></i></div></div><div class="name">C — TORII DRAW</div><div class="desc">鳥居が順番に集まり、形を作ってから消える。静かで洗練された印象。</div><button class="choose" data-choice="C — TORII DRAW">この案を選ぶ</button></section>
<section class="card"><div class="stage"><div class="d"><svg class="fox" viewBox="0 0 32 32" style="--i:0" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg><svg class="fox" viewBox="0 0 32 32" style="--i:1" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg><svg class="fox" viewBox="0 0 32 32" style="--i:2" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg><svg class="fox" viewBox="0 0 32 32" style="--i:3" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg><svg class="fox" viewBox="0 0 32 32" style="--i:4" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg><svg class="fox" viewBox="0 0 32 32" style="--i:5" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg><svg class="fox" viewBox="0 0 32 32" style="--i:6" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg><svg class="fox" viewBox="0 0 32 32" style="--i:7" aria-hidden="true"><path d="M3 4 12 9 16 7 20 9 29 4 27 23 21 29 16 25 11 29 5 23Z"/><path d="M10 17q2-3 4 0-2 3-4 0M18 17q2-3 4 0-2 3-4 0" fill="#fff4e8"/><path d="M14 22h4l-2 2Z" fill="#fff4e8"/></svg></div></div><div class="name">D — FOX RING</div><div class="desc">狐のピクトグラムが巡回。伏見稲荷の神使をモチーフにした案。</div><button class="choose" data-choice="D — FOX RING">この案を選ぶ</button></section>
</main><footer>ボタンを押すと選んだ案を記録します。マップ画面のローディングにはまだ反映されません。</footer><script>document.querySelectorAll('.choose').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.choose').forEach(x=>{x.textContent='この案を選ぶ';x.style.background='#30343a'});b.textContent='✓ 選択中';b.style.background='#c83e2c';localStorage.setItem('fushimi-loader-test-choice',b.dataset.choice)}));const saved=localStorage.getItem('fushimi-loader-test-choice');if(saved){const b=[...document.querySelectorAll('.choose')].find(x=>x.dataset.choice===saved);if(b){b.textContent='✓ 選択中';b.style.background='#c83e2c'}}</script></body></html>
