<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="伏見稲荷スマートガイドの新しい地図・徒歩ナビゲーション">
  <title>新しい地図・ナビ | 伏見稲荷スマートガイド</title>
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@6.18.0/dist/maplibre-gl.css';">
  <link rel="stylesheet" href="css/planner-maplibre.css?v=148">
  <script src="js/carto-config.js?v=148-carto-key" defer></script>
  <script src="js/planner-maplibre.js?v=148" defer></script>
</head>
<body class="maplibre-page">
  <main class="maplibre-shell">
    <div id="smartMap" class="smart-map" aria-label="伏見稲荷の地図"></div>

    <header class="maplibre-topbar">
      <a class="maplibre-back" href="planner.html" aria-label="従来の地図に戻る" title="従来の地図に戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="maplibre-search-wrap">
        <svg class="search-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2"/></svg>
        <input id="destinationSearch" type="search" autocomplete="off" placeholder="スポット・場所を検索" aria-label="スポット・場所を検索">
        <button id="clearSearch" class="search-clear" type="button" aria-label="検索を消去" hidden>×</button>
        <div id="searchResults" class="maplibre-search-results" hidden></div>
      </div>
      <select id="mapLanguage" class="maplibre-language" aria-label="表示言語">
        <option value="ja">日本語</option>
        <option value="en">EN</option>
        <option value="zh">中文</option>
        <option value="ko">한국어</option>
      </select>
    </header>

    <nav class="maplibre-category-rail" aria-label="スポットの種類">
      <button type="button" class="map-category is-active" data-filter="all" aria-pressed="true"><img src="images/icons/category-all.svg" alt=""><span data-label="all">すべて</span></button>
      <button type="button" class="map-category" data-filter="sightseeing" aria-pressed="false"><img src="images/icons/category-sightseeing.svg" alt=""><span data-label="sightseeing">見どころ</span></button>
      <button type="button" class="map-category" data-filter="food" aria-pressed="false"><img src="images/icons/category-food.svg" alt=""><span data-label="food">食べる</span></button>
      <button type="button" class="map-category" data-filter="buy" aria-pressed="false"><img src="images/icons/category-buy.svg" alt=""><span data-label="buy">買う</span></button>
      <button type="button" class="map-category" data-filter="transport" aria-pressed="false"><img src="images/icons/category-transport.svg" alt=""><span data-label="transport">交通</span></button>
      <button type="button" class="map-category" data-filter="toilet" aria-pressed="false"><img src="images/icons/category-facilities.svg" alt=""><span data-label="toilet">トイレ</span></button>
    </nav>

    <div class="maplibre-controls" aria-label="地図操作">
      <button id="zoomInMap" class="maplibre-control zoom-control" type="button" aria-label="拡大" title="拡大"><span class="zoom-glyph">+</span></button>
      <button id="zoomOutMap" class="maplibre-control zoom-control" type="button" aria-label="縮小" title="縮小"><span class="zoom-glyph">−</span></button>
      <button id="tiltMap" class="maplibre-control" type="button" aria-label="地図を傾ける" title="2D / 3D">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
        <span>3D</span>
      </button>
      <button id="compassMap" class="maplibre-control compass-control" type="button" aria-label="北を上にする" title="北を上にする">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="compass-north" d="m12 2 4 10-4-2-4 2 4-10Z"/><path d="m12 22-4-10 4 2 4-2-4 10Z"/></svg>
      </button>
      <button id="locateMap" class="maplibre-control" type="button" aria-label="現在地" title="現在地">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>

    <div id="maplibreStatus" class="maplibre-status" role="status" aria-live="polite">地図を準備しています…</div>

    <section id="maplibreMapFailure" class="maplibre-map-failure" role="alert" hidden>
      <strong>地図を表示できませんでした</strong>
      <p id="maplibreMapFailureText">通信状況を確認して、もう一度お試しください。</p>
      <div class="maplibre-map-failure-actions">
        <button id="retryMapLoad" type="button">もう一度読み込む</button>
        <a href="planner.html">従来の地図を開く</a>
      </div>
    </section>

    <section id="guidanceCard" class="guidance-card" hidden aria-live="polite">
      <div class="guidance-kicker" id="guidanceKicker">次の案内</div>
      <strong id="guidanceInstruction">ルートに沿って進んでください</strong>
      <div class="guidance-meta"><span id="guidanceDistance">-- m</span><span id="guidanceRoad">参道</span></div>
    </section>

    <aside id="maplibreSheet" class="maplibre-sheet" aria-label="スポットとルートの情報">
      <button id="sheetHandle" class="maplibre-sheet-handle" type="button" aria-label="パネルを開閉" aria-expanded="false"><span></span></button>
      <div class="maplibre-sheet-inner">
        <div id="explorePanel" class="explore-panel">
          <div class="sheet-heading-row">
            <div><p class="sheet-eyebrow">FUSHIMI INARI · SMART GUIDE</p><h1 id="exploreHeading">伏見稲荷を探索</h1></div>
            <span class="maplibre-beta-tag">NEW MAP</span>
          </div>
          <p id="exploreIntro" class="explore-intro">スポットを選ぶと、参道に沿った徒歩ルートを検索できます。</p>
          <div id="nearbySpotList" class="nearby-spot-list"></div>
        </div>

        <section id="spotPanel" class="spot-panel" hidden>
          <div class="spot-panel-top">
            <img id="spotPhoto" class="spot-panel-photo" alt="" hidden>
            <div class="spot-panel-copy">
              <div id="spotCategoryLabel" class="spot-panel-category"></div>
              <h2 id="spotPanelName"></h2>
              <p id="spotPanelDescription"></p>
            </div>
            <button id="closeSpotPanel" class="sheet-close" type="button" aria-label="閉じる">×</button>
          </div>
          <div class="spot-panel-actions">
            <button id="routeToSpot" class="primary-action" type="button">ここへ行く</button>
            <button id="saveSpotButton" class="secondary-action save-spot-action" type="button" aria-pressed="false">☆ 保存</button>
          </div>
        </section>

        <section id="routePanel" class="route-panel" hidden>
          <div class="route-panel-title-row">
            <div><p class="sheet-eyebrow" id="routeKicker">徒歩ルート</p><h2 id="routeDestinationTitle">目的地</h2></div>
            <button id="closeRoutePanel" class="sheet-close" type="button" aria-label="閉じる">×</button>
          </div>
          <div id="routeOptions" class="route-options"></div>
          <div class="route-summary">
            <div><strong id="routeEta">--分</strong><span id="routeEtaLabel">徒歩</span></div>
            <div><strong id="routeDistance">-- m</strong><span id="routeDistanceLabel">距離</span></div>
            <div><strong id="routeArrival">--:--</strong><span id="routeArrivalLabel">到着予定</span></div>
          </div>
          <p id="routeQualityNote" class="route-quality-note"></p>
          <p id="routeEtaDisclaimer" class="route-eta-disclaimer">到着予定は標準的な徒歩速度から算出した目安です。階段・坂道・混雑・休憩時間は反映されません。</p>
          <div class="route-panel-actions">
            <button id="startNavigation" class="primary-action" type="button">ナビを開始</button>
          </div>
        </section>

        <section id="activeNavigationPanel" class="active-navigation-panel" hidden>
          <div class="active-nav-stats"><div><strong id="navRemaining">-- m</strong><span id="navRemainingLabel">残り距離</span></div><div><strong id="navArrivalTime">--:--</strong><span id="navArrivalTimeLabel">到着予定</span></div></div>
          <div class="active-nav-actions">
            <button id="toggleVoice" class="secondary-action" type="button" aria-pressed="true">音声案内 ON</button>
            <button id="stopNavigation" class="stop-action" type="button">ナビを終了</button>
          </div>
          <p id="navStatusText" class="nav-status-text" role="status"></p>
        </section>

        <div id="maplibreError" class="maplibre-error" role="alert" hidden></div>
      </div>
    </aside>
  </main>
</body>
</html>
