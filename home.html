<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Fushimi Inari Smart Guide</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================================================
           HOME — VIDEO FULLSCREEN V16
           ホームは「動画 + ナビゲーション + CTA」の1画面だけ
        ========================================================= */

        :root {
            --home-vermilion: #c40018;
            --home-white: #ffffff;
            --home-black: #111111;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
        }

        html {
            scroll-behavior: auto;
        }

        body.home-page {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
            background: #000;
            color: #fff;
            overflow: hidden !important;
            overscroll-behavior: none;
        }

        /*
          ブラウザのアドレスバーや下部ツールバーの高さが変わっても、
          動画エリアを現在の画面全体に固定して、下に黒い隙間を作らない。
        */
        body.home-page main {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body.home-page footer {
            display: none !important;
        }

        /* =========================================================
           LIQUID GLASS HEADER
        ========================================================= */

        body.home-page header {
            position: fixed !important;
            top: 14px !important;
            left: 50% !important;
            z-index: 10000 !important;

            width: calc(100% - 28px) !important;
            min-height: 58px !important;
            padding: 0 20px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 18px;

            transform: translateX(-50%) !important;

            border: 1px solid rgba(255, 255, 255, .30) !important;
            border-radius: 18px !important;

            background: rgba(255, 255, 255, .16) !important;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, .16),
                inset 0 1px 0 rgba(255, 255, 255, .55) !important;

            backdrop-filter: blur(24px) saturate(160%) !important;
            -webkit-backdrop-filter: blur(24px) saturate(160%) !important;
        }

        body.home-page header::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .03)
                );
            pointer-events: none;
        }

        body.home-page header > * {
            position: relative;
            z-index: 1;
        }

        body.home-page header .logo,
        body.home-page header nav a {
            color: #fff !important;
            text-shadow: 0 1px 10px rgba(0, 0, 0, .20);
        }

        body.home-page header .logo {
            flex: 0 0 auto;
            white-space: nowrap;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        body.home-page header nav {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-left: auto;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, .24);
            border-radius: 999px;
            background: rgba(255, 255, 255, .09);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16);
        }

        body.home-page header nav a {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 34px;
            padding: 0 12px;

            border: 1px solid transparent;
            border-radius: 999px;

            color: rgba(255, 255, 255, .90) !important;
            text-decoration: none;

            transition:
                background .28s ease,
                border-color .28s ease,
                box-shadow .28s ease,
                transform .28s ease,
                opacity .28s ease;
        }

        body.home-page header nav a:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, .10);
        }

        body.home-page header nav a.active {
            background: rgba(255, 255, 255, .22) !important;
            border-color: rgba(255, 255, 255, .42) !important;
            box-shadow:
                0 6px 20px rgba(0, 0, 0, .10),
                inset 0 1px 0 rgba(255, 255, 255, .72),
                inset 0 -1px 0 rgba(255, 255, 255, .10);
            opacity: 1 !important;
            transform: translateY(-1px);
        }

        body.home-page header nav a.active::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .14),
                    rgba(255, 255, 255, 0) 65%
                );
            pointer-events: none;
        }

        body.home-page header nav a.active::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 14px;
            height: 2px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .88);
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255, 255, 255, .45);
        }

        body.home-page header #languageSelect {
            flex: 0 0 auto;
            min-height: 34px;
            padding: 0 10px;

            border: 1px solid rgba(255, 255, 255, .36) !important;
            border-radius: 999px;

            background: rgba(255, 255, 255, .14) !important;
            color: #fff !important;

            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26);

            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        body.home-page header #languageSelect option {
            color: #111;
            background: #fff;
        }

        /* =========================================================
           HERO — VIDEO
        ========================================================= */

        .home-hero {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #000;
            isolation: isolate;
        }

        .home-hero-video {
            position: absolute;
            inset: 0;
            z-index: 0;
            display: block;

            width: 100%;
            height: 100%;
            max-width: none;

            object-fit: cover;
            object-position: center center;

            background: #000;
        }

        /* 旧index画面の赤い光球をホームの動画背景へ移植。UI操作を妨げず、ゆっくり漂う。 */
        .home-red-orb {
            position: absolute;
            z-index: 1;
            left: 58%;
            top: 48%;
            width: clamp(280px, 43vw, 680px);
            aspect-ratio: 1;
            border-radius: 50%;
            pointer-events: none;
            opacity: .82;
            background: radial-gradient(
                circle,
                rgba(196, 0, 24, .52) 0%,
                rgba(196, 0, 24, .30) 27%,
                rgba(196, 0, 24, .12) 48%,
                rgba(196, 0, 24, 0) 72%
            );
            filter: blur(18px);
            mix-blend-mode: screen;
            transform: translate3d(-50%, -50%, 0) scale(.86);
            transform-origin: center;
            animation: homeRedOrbDrift 8.5s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        @keyframes homeRedOrbDrift {
            0% {
                transform: translate3d(-43%, -44%, 0) scale(.82);
                opacity: .62;
            }
            45% {
                transform: translate3d(-58%, -55%, 0) scale(1.02);
                opacity: .9;
            }
            100% {
                transform: translate3d(-72%, -45%, 0) scale(1.13);
                opacity: .72;
            }
        }

        @media (max-width: 700px) {
            .home-red-orb {
                left: 62%;
                top: 48%;
                width: clamp(260px, 78vw, 460px);
                opacity: .76;
                filter: blur(15px);
            }
        }

        /*
            動画を見やすくするための最低限のオーバーレイ。
            動画そのものを主役にしつつ、文字だけ読みやすくする。
        */
        .home-hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, .34) 0%,
                    rgba(0, 0, 0, .04) 34%,
                    rgba(0, 0, 0, .16) 60%,
                    rgba(0, 0, 0, .54) 100%
                );
        }

        .home-hero-copy {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 3;

            width: min(1100px, calc(100% - 40px));

            transform: translate(-50%, calc(-50% + 22px));

            color: #fff;
            text-align: center;

            opacity: 0;
            filter: blur(8px);

            transition:
                opacity 1.0s ease,
                transform 1.15s cubic-bezier(.16, 1, .3, 1),
                filter 1.0s ease;
        }

        .home-hero.is-ready .home-hero-copy {
            opacity: 1;
            transform: translate(-50%, -50%);
            filter: blur(0);
        }

        .home-hero-kicker,
        .home-hero-copy h1,
        .home-hero-description,
        .home-plan-button {
            opacity: 0;
            transform: translateY(18px);
            filter: blur(4px);

            transition:
                opacity .85s ease,
                transform 1.0s cubic-bezier(.16, 1, .3, 1),
                filter .85s ease;
        }

        .home-hero.is-ready .home-hero-kicker {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .08s;
        }

        .home-hero.is-ready .home-hero-copy h1 {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .20s;
        }

        .home-hero.is-ready .home-hero-description {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .32s;
        }

        .home-hero.is-ready .home-plan-button {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .44s;
        }

        .home-hero-kicker {
            margin: 0 0 18px;
            color: rgba(255, 255, 255, .80);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .20em;
            text-transform: uppercase;
        }

        .home-hero-copy h1 {
            margin: 0;
            color: #fff;

            font-size: clamp(48px, 7vw, 94px);
            line-height: 1.04;
            letter-spacing: -.055em;
            font-weight: 650;

            text-shadow:
                0 3px 26px rgba(0, 0, 0, .26),
                0 1px 4px rgba(0, 0, 0, .20);
        }

        .home-hero-description {
            margin: 22px 0 0;

            color: rgba(255, 255, 255, .93);
            font-size: clamp(16px, 1.8vw, 21px);
            line-height: 1.65;
            font-weight: 500;

            text-shadow: 0 2px 15px rgba(0, 0, 0, .26);
        }

        /* =========================================================
           CTA — 「観光プランを作る」を分かりやすく
           文字 + 説明 + 矢印で「何ができるボタンか」を明確にする
        ========================================================= */

        .home-plan-button {
            position: relative;

            display: inline-flex;
            align-items: center;
            gap: 14px;

            min-width: 290px;
            margin-top: 30px;
            padding: 10px 16px 10px 12px;

            border: 1px solid rgba(255, 255, 255, .48);
            border-radius: 22px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .94),
                    rgba(255, 255, 255, .82)
                );

            color: #111;
            text-decoration: none;
            text-align: left;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, .20),
                inset 0 1px 0 rgba(255, 255, 255, 1);

            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);

            transition:
                transform .28s ease,
                box-shadow .28s ease,
                background .28s ease;
        }

        .home-plan-button:hover {
            transform: translateY(-3px) scale(1.015);
            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .98),
                    rgba(255, 255, 255, .88)
                );
            box-shadow:
                0 24px 58px rgba(0, 0, 0, .25),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .home-plan-button:active {
            transform: translateY(0) scale(.99);
        }

        .home-plan-icon {
            flex: 0 0 48px;

            width: 48px;
            height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: var(--home-vermilion);
            color: #fff;

            font-size: 23px;
            box-shadow:
                0 8px 20px rgba(196, 0, 24, .28),
                inset 0 1px 0 rgba(255, 255, 255, .35);
        }

        .home-plan-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .home-plan-title {
            font-size: 17px;
            line-height: 1.3;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .home-plan-description {
            color: #666;
            font-size: 12px;
            line-height: 1.4;
            font-weight: 600;
        }

        .home-plan-arrow {
            flex: 0 0 auto;
            margin-left: auto;
            color: var(--home-vermilion);
            font-size: 24px;
            line-height: 1;
            transition: transform .28s ease;
        }

        .home-plan-button:hover .home-plan-arrow {
            transform: translateX(4px);
        }

        /* ホームにはスクロール案内を置かない */
        .home-hero-scroll {
            display: none !important;
        }

        .home-hero-video::-webkit-media-controls,
        .home-hero-video::-webkit-media-controls-enclosure,
        .home-hero-video::-webkit-media-controls-panel {
            display: none !important;
        }

        /* =========================================================
           LIQUID GLASS CURSOR
        ========================================================= */

        @media (any-pointer: fine) {
            body.home-page,
            body.home-page a,
            body.home-page button,
            body.home-page select,
            body.home-page input,
            body.home-page textarea {
                cursor: none;
            }
        }

        .liquid-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 99999;

            width: 34px;
            height: 34px;

            border: 1px solid rgba(255, 255, 255, .82);
            border-radius: 50%;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    rgba(255, 255, 255, .96),
                    rgba(255, 255, 255, .26) 38%,
                    rgba(255, 255, 255, .08) 68%,
                    rgba(196, 0, 24, .12) 100%
                );

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, .12),
                0 10px 28px rgba(0, 0, 0, .14),
                inset 0 1px 0 rgba(255, 255, 255, .94);

            backdrop-filter: blur(10px) saturate(1.4);
            -webkit-backdrop-filter: blur(10px) saturate(1.4);

            transform: translate3d(-50%, -50%, 0);
            opacity: 0;

            transition:
                width .22s ease,
                height .22s ease,
                opacity .18s ease,
                box-shadow .22s ease;
        }

        .liquid-cursor::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;

            width: 7px;
            height: 7px;

            border-radius: 50%;
            transform: translate(-50%, -50%);

            background: var(--home-vermilion);

            box-shadow:
                0 0 10px rgba(196, 0, 24, .34),
                0 0 22px rgba(196, 0, 24, .18);
        }

        .liquid-cursor::after {
            content: "";
            position: absolute;
            inset: -7px;

            border: 1px solid rgba(196, 0, 24, .20);
            border-radius: 50%;

            opacity: .7;
            transform: scale(.88);

            transition:
                transform .28s ease,
                opacity .28s ease;
        }

        .liquid-cursor.is-visible {
            opacity: 1;
        }

        .liquid-cursor.is-hover {
            width: 50px;
            height: 50px;

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, .18),
                0 14px 36px rgba(196, 0, 24, .12),
                inset 0 1px 0 rgba(255, 255, 255, .96);
        }

        .liquid-cursor.is-hover::after {
            transform: scale(1.04);
            opacity: 1;
        }

        .liquid-cursor.is-down {
            width: 26px;
            height: 26px;
        }

        .cursor-ripple {
            position: fixed;
            width: 18px;
            height: 18px;

            border: 1px solid rgba(196, 0, 24, .48);
            border-radius: 50%;

            pointer-events: none;
            z-index: 99998;

            transform: translate3d(-50%, -50%, 0) scale(.7);
            animation: homeCursorRipple .62s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        @keyframes homeCursorRipple {
            0% {
                opacity: .75;
                transform: translate3d(-50%, -50%, 0) scale(.7);
            }

            100% {
                opacity: 0;
                transform: translate3d(-50%, -50%, 0) scale(4.8);
            }
        }

        @media (pointer: coarse) and (not (any-pointer: fine)) {
            .liquid-cursor,
            .cursor-ripple {
                display: none;
            }
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 768px) {
            body.home-page header {
                top: 10px !important;
                width: calc(100% - 20px) !important;
                height: auto !important;
                min-height: 72px !important;
                padding: 9px 12px !important;
                display: flex !important;
                flex-wrap: wrap !important;
                align-items: center !important;
                justify-content: space-between !important;
                column-gap: 8px;
                row-gap: 4px;
                border-radius: 16px !important;
            }

            body.home-page header .logo {
                order: 1;
                flex: 0 0 auto;
                max-width: none;
                overflow: visible;
                text-overflow: clip;
                white-space: nowrap;
                font-size: 12px;
            }

            body.home-page header nav {
                order: 3;
                flex: 0 0 100%;
                width: auto;
                max-width: 100%;
                gap: 3px;
                margin: 0 auto;
                justify-content: center;
                box-sizing: border-box;
            }

            body.home-page header nav a {
                min-height: 32px;
                padding: 0 8px;
                font-size: 12px;
            }

            body.home-page header #languageSelect {
                order: 2;
                margin-left: auto;
                min-height: 32px;
                max-width: 92px;
                padding: 0 7px;
                font-size: 11px;
            }

            .home-hero-copy {
                width: calc(100% - 30px);
            }

            .home-hero-kicker {
                margin-bottom: 14px;
                font-size: 10px;
                letter-spacing: .15em;
            }

            .home-hero-copy h1 {
                font-size: clamp(38px, 10.5vw, 58px);
                line-height: 1.10;
            }

            .home-hero-description {
                margin-top: 16px;
                font-size: 15px;
                line-height: 1.7;
            }

            .home-plan-button {
                width: min(100%, 330px);
                min-width: 0;
                margin-top: 24px;
                padding: 9px 14px 9px 10px;
                border-radius: 19px;
            }

            .home-plan-icon {
                flex-basis: 44px;
                width: 44px;
                height: 44px;
                border-radius: 14px;
                font-size: 21px;
            }

            .home-plan-title {
                font-size: 16px;
            }

            .home-plan-description {
                font-size: 11px;
            }

            .home-plan-arrow {
                font-size: 22px;
            }

            .home-hero-video {
                object-position: center center;
            }
        }

        @media (max-width: 430px) {
            body.home-page header .logo {
                flex: 0 0 auto;
                min-width: 0;
                max-width: none;
                overflow: visible;
                text-overflow: clip;
                white-space: nowrap;
                font-size: 10px;
                letter-spacing: -.025em;
            }

            body.home-page header nav a {
                padding: 0 7px;
                font-size: 11px;
            }

            body.home-page header #languageSelect {
                max-width: 76px;
                font-size: 10px;
            }

            .home-hero-description {
                font-size: 14px;
            }
        }

        /* =========================================================
           V31 — ONE-LINE RESPONSIVE HOME HEADER
           ブランド / ナビ / 言語選択を、スマホでも必ず一段に収める
        ========================================================= */
        body.home-page header .logo {
            display: inline-flex !important;
            align-items: center !important;
            gap: 5px;
            min-width: 0;
            white-space: nowrap !important;
            flex-wrap: nowrap !important;
        }

        body.home-page header .home-brand-mark {
            flex: 0 0 auto;
            line-height: 1;
        }

        body.home-page header .home-brand-name {
            display: inline-block;
            white-space: nowrap !important;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: .035em;
        }

        @media (max-width: 768px) {
            body.home-page header {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: nowrap !important;
                align-items: center !important;
                justify-content: space-between !important;
                width: calc(100% - 16px) !important;
                height: 54px !important;
                min-height: 54px !important;
                max-height: 54px !important;
                padding: 0 8px !important;
                gap: clamp(3px, 1.2vw, 7px) !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
            }

            body.home-page header .logo {
                order: 1 !important;
                flex: 0 0 auto !important;
                max-width: none !important;
                min-width: 0 !important;
                overflow: visible !important;
                text-overflow: clip !important;
                font-size: clamp(8px, 2.5vw, 11px) !important;
                line-height: 1 !important;
                letter-spacing: -.025em !important;
            }

            body.home-page header .home-brand-name {
                letter-spacing: -.045em !important;
            }

            body.home-page header nav {
                order: 2 !important;
                display: flex !important;
                flex: 1 1 auto !important;
                width: auto !important;
                min-width: 0 !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 2px !important;
                gap: 0 !important;
                flex-wrap: nowrap !important;
                justify-content: center !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
            }

            body.home-page header nav a {
                display: inline-flex !important;
                flex: 0 1 auto !important;
                min-width: 0 !important;
                min-height: 30px !important;
                padding: 0 clamp(3px, .9vw, 7px) !important;
                margin: 0 !important;
                font-size: clamp(9px, 2.7vw, 12px) !important;
                line-height: 1 !important;
                white-space: nowrap !important;
                letter-spacing: -.02em;
            }

            body.home-page header #languageSelect {
                order: 3 !important;
                flex: 0 0 57px !important;

    <script id="fushimi-v87-liquid-cursor-script">
(() => {
    "use strict";
    const cursor = document.querySelector(".liquid-cursor");
    if (!cursor || !(window.matchMedia("(pointer: fine)").matches || window.matchMedia("(any-pointer: fine)").matches)) return;

    const interactiveSelector = "a, button, select, input, textarea, [role='button'], .leaflet-control, .leaflet-marker-icon, .leaflet-interactive";
    const interactiveFor = target => target instanceof Element ? target.closest(interactiveSelector) : null;

    function moveCursor(event) {
        if (event.pointerType !== "mouse") return;
        // Keep the visual cursor precisely under the real pointer (no trailing animation).
        cursor.style.left = `${event.clientX}px`;
        cursor.style.top = `${event.clientY}px`;
        cursor.classList.add("is-visible");
    }

    document.addEventListener("pointermove", moveCursor, { passive: true });

    document.addEventListener("pointerover", event => {
        if (interactiveFor(event.target)) cursor.classList.add("is-hover");
    });

    document.addEventListener("pointerout", event => {
        const from = interactiveFor(event.target);
        const to = interactiveFor(event.relatedTarget);
        if (from !== to) cursor.classList.toggle("is-hover", Boolean(to));
    });

    document.addEventListener("pointerdown", event => {
        if (event.pointerType !== "mouse") return;
        cursor.classList.add("is-down");
        const ripple = document.createElement("span");
        ripple.className = "cursor-ripple";
        ripple.style.left = `${event.clientX}px`;
        ripple.style.top = `${event.clientY}px`;
        document.body.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove(), { once: true });
    });

    document.addEventListener("pointerup", () => cursor.classList.remove("is-down"));
    document.addEventListener("pointercancel", () => cursor.classList.remove("is-down"));
    document.addEventListener("pointerleave", event => {
        if (event.pointerType === "mouse") cursor.classList.remove("is-visible");
    });
    document.addEventListener("pointerenter", event => {
        if (event.pointerType === "mouse") cursor.classList.add("is-visible");
    });
})();
</script>


<script id="fushimi-home-prefetch-and-rhythm-omikuji">
(() => {
    "use strict";

    // Prefetch weather + sunrise/sunset from the HOME page. The map reads this shared cache
    // immediately and still refreshes on its own. No weather text is shown in the UI.
    const CACHE_KEY = "fushimiMetaMapApiCacheV1";
    const LAT = 34.96705;
    const LNG = 135.7743;
    const TZ = "Asia/Tokyo";

    (async function prefetchFushimiConditions() {
        try {
            const params = new URLSearchParams({
                latitude: String(LAT), longitude: String(LNG),
                current: "temperature_2m,apparent_temperature,is_day,precipitation,weather_code",
                daily: "sunrise,sunset", timezone: TZ, past_days: "1", forecast_days: "2"
            });
            const controller = new AbortController();
            const timeout = window.setTimeout(() => controller.abort(), 8500);
            let response;
            try {
                response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`, {
                    method: "GET", headers: { "Accept": "application/json" }, signal: controller.signal, cache: "no-store"
                });
            } finally { window.clearTimeout(timeout); }
            if (!response.ok) throw new Error(`Open-Meteo HTTP ${response.status}`);
            const payload = await response.json();
            if (!payload.current || !payload.daily || !Array.isArray(payload.daily.time) ||
                !Array.isArray(payload.daily.sunrise) || !Array.isArray(payload.daily.sunset)) {
                throw new Error("Open-Meteo response is incomplete");
            }
            const now = Date.now();
            let previous = {};
            try { previous = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}") || {}; } catch (_) {}
            localStorage.setItem(CACHE_KEY, JSON.stringify({
                ...previous, schema: 1, latitude: LAT, longitude: LNG,
                fetchedAt: now, currentFetchedAt: now, dailyFetchedAt: now,
                current: payload.current, daily: payload.daily
            }));
        } catch (error) {
            // Do not erase previously cached data when offline; keep the map's light working.
            console.debug("伏見稲荷の気象データは既存キャッシュを利用します。", error);
        }
    })();

            grades: ["大吉", "中吉", "小吉", "吉", "末吉", "凶"], luck: "今日开运提示",

            ]

        const select = document.querySelector("#languageSelect");

    // Six taps with the short-short-long / short-short cadence. The tolerance is deliberately
    // generous for touchscreens; a small timing variation should not make the Easter egg fail.
    function rhythmMatches(times) {

        const gaps = times.slice(1).map((value, index) => value - times[index]);
        if (gaps.some(gap => gap < 65 || gap > 900)) return false;
        const total = times[5] - times[0];
        if (total < 450 || total > 3000) return false;
        const mean = gaps.reduce((sum, value) => sum + value, 0) / gaps.length;
        const target = [0.55, 1.0, 1.5, 0.55, 1.0];
        const normalized = gaps.map(value => value / mean);
        const deviation = normalized.reduce((sum, value, index) => sum + Math.abs(value - target[index]), 0) / target.length;

        overlay.querySelector(".fushimi-omikuji-grade").textContent = t.grades[index];
        overlay.querySelector(".fushimi-omikuji-message").textContent = t.fortunes[index][0];
        overlay.querySelector(".fushimi-omikuji-luck-label").textContent = t.luck;
        overlay.querySelector(".fushimi-omikuji-luck").textContent = t.fortunes[index][1];
        overlay.querySelector(".fushimi-omikuji-x").setAttribute("aria-label", t.close);
        overlay.querySelector(".fushimi-omikuji-again").textContent = t.again;
        overlay.classList.remove("is-visible");
        requestAnimationFrame(() => {
            overlay.classList.add("is-visible");
            overlay.setAttribute("aria-hidden", "false");
            overlay.querySelector(".fushimi-omikuji-card").focus({ preventScroll: true });
        });
        try { if (navigator.vibrate) navigator.vibrate([15, 35, 20]); } catch (_) {}
    }

    document.addEventListener("pointerdown", event => {
        if (event.button !== undefined && event.button !== 0) return;
        const target = event.target;
        if (!(target instanceof Element)) return;
        // Do not hijack navigation or controls; taps on the home background / hero count.
        if (target.closest("a, button, select, input, textarea, label, [role='button'], #fushimi-omikuji-overlay")) {
            tapTimes = [];
            return;
        }
        const now = performance.now();
        if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 900) tapTimes = [];
        tapTimes.push(now);
        if (tapTimes.length > 6) tapTimes = tapTimes.slice(-6);
        if (rhythmMatches(tapTimes)) {
            tapTimes = [];
            drawOmikuji();
        }
    }, { passive: true });
})();
</script>

</body>
</html>
