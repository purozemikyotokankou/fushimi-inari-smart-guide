<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Fushimi Inari Smart Guide</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================================================
           HOME — VIDEO ONLY
           ホームは「動画 + ナビゲーション + CTA」の1画面だけ
        ========================================================= */

        :root {
            --home-vermilion: #c40018;
            --home-white: #ffffff;
            --home-black: #111111;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
        }

        html {
            scroll-behavior: auto;
        }

        body.home-page {
            min-height: 100svh;
            background: #000;
            color: #fff;
            overflow: hidden !important;
            overscroll-behavior: none;
        }

        body.home-page main {
            width: 100%;
            height: 100svh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body.home-page footer {
            display: none !important;
        }

        /* =========================================================
           LIQUID GLASS HEADER
        ========================================================= */

        body.home-page header {
            position: fixed !important;
            top: 14px !important;
            left: 50% !important;
            z-index: 10000 !important;

            width: calc(100% - 28px) !important;
            min-height: 58px !important;
            padding: 0 20px !important;

            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 18px;

            transform: translateX(-50%) !important;

            border: 1px solid rgba(255, 255, 255, .30) !important;
            border-radius: 18px !important;

            background: rgba(255, 255, 255, .16) !important;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, .16),
                inset 0 1px 0 rgba(255, 255, 255, .55) !important;

            backdrop-filter: blur(24px) saturate(160%) !important;
            -webkit-backdrop-filter: blur(24px) saturate(160%) !important;
        }

        body.home-page header::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .18),
                    rgba(255, 255, 255, .03)
                );
            pointer-events: none;
        }

        body.home-page header > * {
            position: relative;
            z-index: 1;
        }

        body.home-page header .logo,
        body.home-page header nav a {
            color: #fff !important;
            text-shadow: 0 1px 10px rgba(0, 0, 0, .20);
        }

        body.home-page header .logo {
            flex: 0 0 auto;
            white-space: nowrap;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        body.home-page header nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-left: auto;
        }

        body.home-page header nav a {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 34px;
            padding: 0 12px;

            border: 1px solid transparent;
            border-radius: 999px;

            color: rgba(255, 255, 255, .90) !important;
            text-decoration: none;

            transition:
                background .28s ease,
                border-color .28s ease,
                box-shadow .28s ease,
                transform .28s ease,
                opacity .28s ease;
        }

        body.home-page header nav a:hover {
            color: #fff !important;
            background: rgba(255, 255, 255, .10);
        }

        body.home-page header nav a.active {
            background: rgba(255, 255, 255, .22) !important;
            border-color: rgba(255, 255, 255, .42) !important;
            box-shadow:
                0 6px 20px rgba(0, 0, 0, .10),
                inset 0 1px 0 rgba(255, 255, 255, .72),
                inset 0 -1px 0 rgba(255, 255, 255, .10);
            opacity: 1 !important;
            transform: translateY(-1px);
        }

        body.home-page header nav a.active::before {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .14),
                    rgba(255, 255, 255, 0) 65%
                );
            pointer-events: none;
        }

        body.home-page header nav a.active::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 14px;
            height: 2px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .88);
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255, 255, 255, .45);
        }

        body.home-page header #languageSelect {
            flex: 0 0 auto;
            min-height: 34px;
            padding: 0 10px;

            border: 1px solid rgba(255, 255, 255, .36) !important;
            border-radius: 999px;

            background: rgba(255, 255, 255, .14) !important;
            color: #fff !important;

            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26);

            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        body.home-page header #languageSelect option {
            color: #111;
            background: #fff;
        }

        /* =========================================================
           HERO — VIDEO
        ========================================================= */

        .home-hero {
            position: relative;
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
            background: #000;
            isolation: isolate;
        }

        .home-hero-video {
            position: absolute;
            inset: 0;
            z-index: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            background: #000;
        }

        /*
            動画を見やすくするための最低限のオーバーレイ。
            動画そのものを主役にしつつ、文字だけ読みやすくする。
        */
        .home-hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, .34) 0%,
                    rgba(0, 0, 0, .04) 34%,
                    rgba(0, 0, 0, .16) 60%,
                    rgba(0, 0, 0, .54) 100%
                );
        }

        .home-hero-copy {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;

            width: min(1100px, calc(100% - 40px));

            transform: translate(-50%, calc(-50% + 22px));

            color: #fff;
            text-align: center;

            opacity: 0;
            filter: blur(8px);

            transition:
                opacity 1.0s ease,
                transform 1.15s cubic-bezier(.16, 1, .3, 1),
                filter 1.0s ease;
        }

        .home-hero.is-ready .home-hero-copy {
            opacity: 1;
            transform: translate(-50%, -50%);
            filter: blur(0);
        }

        .home-hero-kicker,
        .home-hero-copy h1,
        .home-hero-description,
        .home-plan-button {
            opacity: 0;
            transform: translateY(18px);
            filter: blur(4px);

            transition:
                opacity .85s ease,
                transform 1.0s cubic-bezier(.16, 1, .3, 1),
                filter .85s ease;
        }

        .home-hero.is-ready .home-hero-kicker {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .08s;
        }

        .home-hero.is-ready .home-hero-copy h1 {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .20s;
        }

        .home-hero.is-ready .home-hero-description {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .32s;
        }

        .home-hero.is-ready .home-plan-button {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            transition-delay: .44s;
        }

        .home-hero-kicker {
            margin: 0 0 18px;
            color: rgba(255, 255, 255, .80);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .20em;
            text-transform: uppercase;
        }

        .home-hero-copy h1 {
            margin: 0;
            color: #fff;

            font-size: clamp(48px, 7vw, 94px);
            line-height: 1.04;
            letter-spacing: -.055em;
            font-weight: 650;

            text-shadow:
                0 3px 26px rgba(0, 0, 0, .26),
                0 1px 4px rgba(0, 0, 0, .20);
        }

        .home-hero-description {
            margin: 22px 0 0;

            color: rgba(255, 255, 255, .93);
            font-size: clamp(16px, 1.8vw, 21px);
            line-height: 1.65;
            font-weight: 500;

            text-shadow: 0 2px 15px rgba(0, 0, 0, .26);
        }

        /* =========================================================
           CTA — 「観光プランを作る」を分かりやすく
           文字 + 説明 + 矢印で「何ができるボタンか」を明確にする
        ========================================================= */

        .home-plan-button {
            position: relative;

            display: inline-flex;
            align-items: center;
            gap: 14px;

            min-width: 290px;
            margin-top: 30px;
            padding: 10px 16px 10px 12px;

            border: 1px solid rgba(255, 255, 255, .48);
            border-radius: 22px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .94),
                    rgba(255, 255, 255, .82)
                );

            color: #111;
            text-decoration: none;
            text-align: left;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, .20),
                inset 0 1px 0 rgba(255, 255, 255, 1);

            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);

            transition:
                transform .28s ease,
                box-shadow .28s ease,
                background .28s ease;
        }

        .home-plan-button:hover {
            transform: translateY(-3px) scale(1.015);
            background:
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, .98),
                    rgba(255, 255, 255, .88)
                );
            box-shadow:
                0 24px 58px rgba(0, 0, 0, .25),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .home-plan-button:active {
            transform: translateY(0) scale(.99);
        }

        .home-plan-icon {
            flex: 0 0 48px;

            width: 48px;
            height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: var(--home-vermilion);
            color: #fff;

            font-size: 23px;
            box-shadow:
                0 8px 20px rgba(196, 0, 24, .28),
                inset 0 1px 0 rgba(255, 255, 255, .35);
        }

        .home-plan-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .home-plan-title {
            font-size: 17px;
            line-height: 1.3;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .home-plan-description {
            color: #666;
            font-size: 12px;
            line-height: 1.4;
            font-weight: 600;
        }

        .home-plan-arrow {
            flex: 0 0 auto;
            margin-left: auto;
            color: var(--home-vermilion);
            font-size: 24px;
            line-height: 1;
            transition: transform .28s ease;
        }

        .home-plan-button:hover .home-plan-arrow {
            transform: translateX(4px);
        }

        /* ホームにはスクロール案内を置かない */
        .home-hero-scroll {
            display: none !important;
        }

        .home-hero-video::-webkit-media-controls,
        .home-hero-video::-webkit-media-controls-enclosure,
        .home-hero-video::-webkit-media-controls-panel {
            display: none !important;
        }

        /* =========================================================
           LIQUID GLASS CURSOR
        ========================================================= */

        @media (pointer: fine) {
            body.home-page,
            body.home-page a,
            body.home-page button,
            body.home-page select,
            body.home-page input,
            body.home-page textarea {
                cursor: none;
            }
        }

        .liquid-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 99999;

            width: 34px;
            height: 34px;

            border: 1px solid rgba(255, 255, 255, .82);
            border-radius: 50%;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    rgba(255, 255, 255, .96),
                    rgba(255, 255, 255, .26) 38%,
                    rgba(255, 255, 255, .08) 68%,
                    rgba(196, 0, 24, .12) 100%
                );

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, .12),
                0 10px 28px rgba(0, 0, 0, .14),
                inset 0 1px 0 rgba(255, 255, 255, .94);

            backdrop-filter: blur(10px) saturate(1.4);
            -webkit-backdrop-filter: blur(10px) saturate(1.4);

            transform: translate3d(-50%, -50%, 0);
            opacity: 0;

            transition:
                width .22s ease,
                height .22s ease,
                opacity .18s ease,
                box-shadow .22s ease;
        }

        .liquid-cursor::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;

            width: 7px;
            height: 7px;

            border-radius: 50%;
            transform: translate(-50%, -50%);

            background: var(--home-vermilion);

            box-shadow:
                0 0 10px rgba(196, 0, 24, .34),
                0 0 22px rgba(196, 0, 24, .18);
        }

        .liquid-cursor::after {
            content: "";
            position: absolute;
            inset: -7px;

            border: 1px solid rgba(196, 0, 24, .20);
            border-radius: 50%;

            opacity: .7;
            transform: scale(.88);

            transition:
                transform .28s ease,
                opacity .28s ease;
        }

        .liquid-cursor.is-visible {
            opacity: 1;
        }

        .liquid-cursor.is-hover {
            width: 50px;
            height: 50px;

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, .18),
                0 14px 36px rgba(196, 0, 24, .12),
                inset 0 1px 0 rgba(255, 255, 255, .96);
        }

        .liquid-cursor.is-hover::after {
            transform: scale(1.04);
            opacity: 1;
        }

        .liquid-cursor.is-down {
            width: 26px;
            height: 26px;
        }

        .cursor-ripple {
            position: fixed;
            width: 18px;
            height: 18px;

            border: 1px solid rgba(196, 0, 24, .48);
            border-radius: 50%;

            pointer-events: none;
            z-index: 99998;

            transform: translate3d(-50%, -50%, 0) scale(.7);
            animation: homeCursorRipple .62s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        @keyframes homeCursorRipple {
            0% {
                opacity: .75;
                transform: translate3d(-50%, -50%, 0) scale(.7);
            }

            100% {
                opacity: 0;
                transform: translate3d(-50%, -50%, 0) scale(4.8);
            }
        }

        @media (pointer: coarse) {
            .liquid-cursor,
            .cursor-ripple {
                display: none;
            }
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 768px) {
            body.home-page header {
                top: 10px !important;
                width: calc(100% - 20px) !important;
                min-height: 54px !important;
                padding: 0 12px !important;
                gap: 8px;
                border-radius: 16px !important;
            }

            body.home-page header .logo {
                max-width: 42vw;
                overflow: hidden;
                text-overflow: ellipsis;
                font-size: 12px;
            }

            body.home-page header nav {
                gap: 1px;
                margin-left: 0;
            }

            body.home-page header nav a {
                min-height: 32px;
                padding: 0 8px;
                font-size: 12px;
            }

            body.home-page header #languageSelect {
                min-height: 32px;
                max-width: 92px;
                padding: 0 7px;
                font-size: 11px;
            }

            .home-hero-copy {
                width: calc(100% - 30px);
            }

            .home-hero-kicker {
                margin-bottom: 14px;
                font-size: 10px;
                letter-spacing: .15em;
            }

            .home-hero-copy h1 {
                font-size: clamp(38px, 10.5vw, 58px);
                line-height: 1.10;
            }

            .home-hero-description {
                margin-top: 16px;
                font-size: 15px;
                line-height: 1.7;
            }

            .home-plan-button {
                width: min(100%, 330px);
                min-width: 0;
                margin-top: 24px;
                padding: 9px 14px 9px 10px;
                border-radius: 19px;
            }

            .home-plan-icon {
                flex-basis: 44px;
                width: 44px;
                height: 44px;
                border-radius: 14px;
                font-size: 21px;
            }

            .home-plan-title {
                font-size: 16px;
            }

            .home-plan-description {
                font-size: 11px;
            }

            .home-plan-arrow {
                font-size: 22px;
            }

            .home-hero-video {
                object-position: center center;
            }
        }

        @media (max-width: 430px) {
            body.home-page header .logo {
                max-width: 29vw;
                font-size: 10px;
            }

            body.home-page header nav a {
                padding: 0 6px;
                font-size: 11px;
            }

            body.home-page header #languageSelect {
                max-width: 76px;
                font-size: 10px;
            }

            .home-hero-description {
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body class="home-page">

    <div class="liquid-cursor" aria-hidden="true"></div>

    <header>
        <div class="logo">⛩ Fushimi Inari Smart Guide</div>

        <nav>
            <a class="liquid-nav-link" href="home.html" data-i18n="home">ホーム</a>
            <a class="liquid-nav-link" href="planner.html" data-i18n="planner">ルート作成</a>
            <a class="liquid-nav-link" href="spots.html" data-i18n="spots">スポット</a>
        </nav>

        <select id="languageSelect" aria-label="Language">
            <option value="ja">🇯🇵 日本語</option>
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ko">🇰🇷 한국어</option>
        </select>
    </header>

    <main>
        <section class="home-hero" aria-label="Fushimi Inari Smart Guide">

            <video
                class="home-hero-video"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
                aria-label="伏見稲荷の映像"
            >
                <source src="videos/fushimi.mp4" type="video/mp4">
            </video>

            <div class="home-hero-overlay" aria-hidden="true"></div>

            <div class="home-hero-copy">

                <p
                    class="home-hero-kicker"
                    data-i18n="homeIntroEyebrow"
                >
                    FUSHIMI INARI · SMART GUIDE
                </p>

                <h1>
                    伏見稲荷マップ
                </h1>

                <p
                    class="home-hero-description"
                    data-i18n="heroTitle"
                >
                    伏見稲荷をもっと楽しく。
                </p>

                <a
                    href="planner.html"
                    class="home-plan-button"
                    aria-label="ルートを作る"
                >
                    <span class="home-plan-icon" aria-hidden="true">🧭</span>

                    <span class="home-plan-text">
                        <span class="home-plan-title" data-i18n="makePlan">ルートを作る</span>
                        <span
                            class="home-plan-description"
                            data-i18n="plannerDescription"
                        >
                            行きたいスポットを選んで、ルートを作成
                        </span>
                    </span>

                    <span class="home-plan-arrow" aria-hidden="true">→</span>
                </a>

            </div>

        </section>
    </main>

    <script src="js/language.js"></script>

    <script>
        /* =========================================================
           現在のページを自動判定してLiquid Glassを付ける
        ========================================================= */
        document.addEventListener("DOMContentLoaded", function () {
            const current =
                (window.location.pathname.split("/").pop() || "home.html").toLowerCase();

            document
                .querySelectorAll(".liquid-nav-link")
                .forEach(function (link) {
                    const target =
                        (link.getAttribute("href") || "").toLowerCase();

                    const isActive = target === current;

                    link.classList.toggle("active", isActive);

                    if (isActive) {
                        link.setAttribute("aria-current", "page");
                    } else {
                        link.removeAttribute("aria-current");
                    }
                });
        });
    </script>

    <script>
        /* =========================================================
           動画の準備ができたらヒーロー文字を表示
        ========================================================= */
        document.addEventListener("DOMContentLoaded", function () {
            const hero = document.querySelector(".home-hero");
            const video = document.querySelector(".home-hero-video");

            if (!hero) return;

            function showHero() {
                hero.classList.add("is-ready");
            }

            if (!video) {
                showHero();
                return;
            }

            if (video.readyState >= 2) {
                requestAnimationFrame(showHero);
                return;
            }

            video.addEventListener("loadeddata", showHero, { once: true });

            /* 動画読み込みが遅い環境でも文字を消したままにしない */
            window.setTimeout(showHero, 1200);
        });
    </script>

    <script>
        /* =========================================================
           Liquid Glass Cursor
        ========================================================= */
        (() => {
            const cursor = document.querySelector(".liquid-cursor");
            if (!cursor) return;

            const finePointer = window.matchMedia("(pointer: fine)");
            if (!finePointer.matches) return;

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let currentX = mouseX;
            let currentY = mouseY;
            let visible = false;

            function moveCursor(event) {
                mouseX = event.clientX;
                mouseY = event.clientY;

                if (!visible) {
                    currentX = mouseX;
                    currentY = mouseY;
                    visible = true;
                    cursor.classList.add("is-visible");
                }
            }

            function animate() {
                currentX += (mouseX - currentX) * 0.18;
                currentY += (mouseY - currentY) * 0.18;

                cursor.style.transform =
                    `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%)`;

                requestAnimationFrame(animate);
            }

            function isInteractive(target) {
                return target instanceof Element &&
                    target.closest("a, button, select, input, textarea");
            }

            document.addEventListener("mousemove", moveCursor);

            document.addEventListener("mouseover", event => {
                if (isInteractive(event.target)) {
                    cursor.classList.add("is-hover");
                }
            });

            document.addEventListener("mouseout", event => {
                if (isInteractive(event.target)) {
                    cursor.classList.remove("is-hover");
                }
            });

            document.addEventListener("mousedown", event => {
                cursor.classList.add("is-down");

                const ripple = document.createElement("span");
                ripple.className = "cursor-ripple";
                ripple.style.left = `${event.clientX}px`;
                ripple.style.top = `${event.clientY}px`;

                document.body.appendChild(ripple);

                ripple.addEventListener(
                    "animationend",
                    () => ripple.remove(),
                    { once: true }
                );
            });

            document.addEventListener("mouseup", () => {
                cursor.classList.remove("is-down");
            });

            document.addEventListener("mouseleave", () => {
                visible = false;
                cursor.classList.remove("is-visible");
            });

            document.addEventListener("mouseenter", () => {
                visible = true;
                cursor.classList.add("is-visible");
            });

            animate();
        })();
    </script>

</body>
</html>
