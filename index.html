<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fushimi Inari Smart Guide</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================================================
           Liquid Glass language screen
           ========================================================= */

        :root {
            --lg-red: #c40018;
            --lg-red-soft: rgba(196, 0, 24, 0.22);
            --lg-white: rgba(255, 255, 255, 0.72);
            --lg-white-soft: rgba(255, 255, 255, 0.18);
            --lg-border: rgba(255, 255, 255, 0.42);
            --lg-text: #19191b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body.language-page {
            min-height: 100vh;
            overflow: hidden;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            color: var(--lg-text);
            background:
                radial-gradient(circle at 16% 18%, rgba(255, 86, 109, 0.34), transparent 25%),
                radial-gradient(circle at 83% 14%, rgba(255, 179, 194, 0.42), transparent 27%),
                radial-gradient(circle at 76% 83%, rgba(154, 38, 55, 0.24), transparent 28%),
                linear-gradient(135deg, #f7f7f4 0%, #ececea 52%, #e4e4e1 100%);
        }

        /* Soft blurred light blobs behind the glass */
        body.language-page::before,
        body.language-page::after {
            content: "";
            position: fixed;
            pointer-events: none;
            border-radius: 999px;
            filter: blur(18px);
            mix-blend-mode: screen;
        }

        body.language-page::before {
            width: 40vw;
            height: 40vw;
            min-width: 260px;
            min-height: 260px;
            left: -10vw;
            top: 45%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0));
            animation: floatLeft 11s ease-in-out infinite alternate;
        }

        body.language-page::after {
            width: 34vw;
            height: 34vw;
            min-width: 240px;
            min-height: 240px;
            right: -8vw;
            bottom: -8vw;
            background: radial-gradient(circle, var(--lg-red-soft), rgba(255, 255, 255, 0));
            animation: floatRight 13s ease-in-out infinite alternate;
        }

        .overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                linear-gradient(
                    115deg,
                    rgba(255,255,255,0.48) 0%,
                    rgba(255,255,255,0.10) 35%,
                    rgba(255,255,255,0.30) 65%,
                    rgba(255,255,255,0.10) 100%
                );

            backdrop-filter: blur(10px) saturate(1.08);
            -webkit-backdrop-filter: blur(10px) saturate(1.08);
        }

        .language-box {
            width: min(520px, 100%);
            padding: 52px 42px 38px;
            position: relative;
            isolation: isolate;

            border: 1px solid var(--lg-border);
            border-radius: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.66),
                    rgba(255,255,255,0.28) 46%,
                    rgba(255,255,255,0.40)
                );

            box-shadow:
                0 35px 80px rgba(31, 31, 33, 0.16),
                inset 0 1px 0 rgba(255,255,255,0.80),
                inset 0 -1px 0 rgba(255,255,255,0.18);

            backdrop-filter: blur(30px) saturate(1.35);
            -webkit-backdrop-filter: blur(30px) saturate(1.35);

            text-align: center;

            animation:
                glassIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both,
                glassFloat 7s ease-in-out 1.1s infinite;
        }

        /* Glass reflection */
        .language-box::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 33px;
            pointer-events: none;
            z-index: -1;

            background:
                linear-gradient(
                    155deg,
                    rgba(255,255,255,0.58),
                    rgba(255,255,255,0.00) 34%
                );
        }

        .language-box::after {
            content: "";
            position: absolute;
            left: 14%;
            top: 12px;
            width: 72%;
            height: 1px;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
            filter: blur(0.2px);
            pointer-events: none;
        }

        .language-box h1 {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;

            display: grid;
            place-items: center;

            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.68);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.72),
                    rgba(255,255,255,0.22)
                );

            box-shadow:
                0 15px 28px rgba(196, 0, 24, 0.13),
                inset 0 1px 0 rgba(255,255,255,0.86);

            color: var(--lg-red);
            font-size: 34px;
            line-height: 1;
            text-shadow: 0 2px 12px rgba(196, 0, 24, 0.13);
        }

        .language-box h2 {
            margin: 0 0 14px;

            font-size: clamp(28px, 4vw, 39px);
            line-height: 1.08;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        .language-box p {
            margin: 0;
            color: rgba(25, 25, 27, 0.68);
            font-size: 14px;
            line-height: 1.7;
        }

        .language-box p + p {
            margin-top: 2px;
            font-size: 13px;
            color: rgba(25, 25, 27, 0.48);
        }

        .language-box button {
            width: 100%;
            margin-top: 12px;
            min-height: 56px;
            padding: 0 22px;

            border: 1px solid rgba(255,255,255,0.50);
            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.58),
                    rgba(255,255,255,0.20)
                );

            color: #1b1b1d;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.70),
                0 8px 20px rgba(31,31,33,0.06);

            backdrop-filter: blur(18px) saturate(1.25);
            -webkit-backdrop-filter: blur(18px) saturate(1.25);

            cursor: pointer;
            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                background 0.22s ease,
                border-color 0.22s ease;
        }

        .language-box button:hover {
            transform: translateY(-2px) scale(1.012);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.74),
                    rgba(255,255,255,0.30)
                );

            border-color: rgba(255,255,255,0.74);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.86),
                0 14px 28px rgba(31,31,33,0.10);
        }

        .language-box button:active {
            transform: translateY(0) scale(0.992);
        }

        .language-box button:first-of-type:hover {
            box-shadow:
                0 14px 28px rgba(196, 0, 24, 0.12),
                inset 0 1px 0 rgba(255,255,255,0.86);
        }

        @keyframes glassIn {
            from {
                opacity: 0;
                transform: translateY(22px) scale(0.965);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes glassFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes floatLeft {
            from {
                transform: translate3d(0, -4%, 0) scale(1);
            }
            to {
                transform: translate3d(5%, 4%, 0) scale(1.08);
            }
        }

        @keyframes floatRight {
            from {
                transform: translate3d(0, 2%, 0) scale(1);
            }
            to {
                transform: translate3d(-5%, -5%, 0) scale(1.10);
            }
        }


        /* =========================================================
           Liquid Glass Cursor
           ========================================================= */

        body.language-page,
        body.language-page button {
            cursor: none;
        }

        .liquid-cursor {
            position: fixed;
            left: 0;
            top: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;

            border: 1px solid rgba(255, 255, 255, 0.78);

            background:
                radial-gradient(
                    circle at 30% 25%,
                    rgba(255, 255, 255, 0.92),
                    rgba(255, 255, 255, 0.26) 38%,
                    rgba(255, 255, 255, 0.10) 70%,
                    rgba(196, 0, 24, 0.10) 100%
                );

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.14),
                0 8px 24px rgba(31, 31, 33, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.88);

            backdrop-filter: blur(10px) saturate(1.35);
            -webkit-backdrop-filter: blur(10px) saturate(1.35);

            transform: translate3d(-50%, -50%, 0) scale(1);
            opacity: 0;
            transition:
                width 0.22s ease,
                height 0.22s ease,
                opacity 0.2s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;
            will-change: transform, width, height, opacity;
        }

        .liquid-cursor::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: rgba(196, 0, 24, 0.85);
            box-shadow:
                0 0 10px rgba(196, 0, 24, 0.38),
                0 0 22px rgba(196, 0, 24, 0.20);
        }

        .liquid-cursor::after {
            content: "";
            position: absolute;
            inset: -7px;
            border-radius: 50%;
            border: 1px solid rgba(196, 0, 24, 0.20);
            opacity: 0.7;
            transform: scale(0.88);
            transition: transform 0.28s ease, opacity 0.28s ease;
        }

        .liquid-cursor.is-visible {
            opacity: 1;
        }

        .liquid-cursor.is-hover {
            width: 48px;
            height: 48px;
            border-color: rgba(255, 255, 255, 0.92);

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.16),
                0 12px 32px rgba(196, 0, 24, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.94);
        }

        .liquid-cursor.is-hover::after {
            transform: scale(1.04);
            opacity: 1;
        }

        .liquid-cursor.is-down {
            width: 27px;
            height: 27px;
        }

        .cursor-ripple {
            position: fixed;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;

            border: 1px solid rgba(196, 0, 24, 0.50);
            box-shadow:
                0 0 18px rgba(196, 0, 24, 0.16),
                inset 0 0 10px rgba(255, 255, 255, 0.25);

            transform: translate3d(-50%, -50%, 0) scale(1);
            animation: cursorRipple 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cursorRipple {
            0% {
                opacity: 0.75;
                transform: translate3d(-50%, -50%, 0) scale(0.7);
            }
            100% {
                opacity: 0;
                transform: translate3d(-50%, -50%, 0) scale(4.8);
            }
        }

        @media (pointer: coarse), (max-width: 700px) {
            body.language-page,
            body.language-page button {
                cursor: auto;
            }

            .liquid-cursor,
            .cursor-ripple {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .liquid-cursor,
            .liquid-cursor::after {
                transition: none;
            }

            .cursor-ripple {
                display: none;
            }
        }

        @media (max-width: 600px) {
            body.language-page {
                padding: 16px;
            }

            .language-box {
                padding: 40px 22px 24px;
                border-radius: 28px;
            }

            .language-box::before {
                border-radius: 27px;
            }

            .language-box h1 {
                width: 68px;
                height: 68px;
                border-radius: 21px;
            }

            .language-box h2 {
                font-size: 29px;
            }

            .language-box button {
                min-height: 54px;
                border-radius: 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            /* The panel itself stays still, but keep the gentle ambient light alive. */
            .language-box {
                animation: none;
            }

            body.language-page::before {
                animation: floatLeft 11s ease-in-out infinite alternate !important;
                animation-duration: 11s !important;
                animation-iteration-count: infinite !important;
            }

            body.language-page::after {
                animation: floatRight 13s ease-in-out infinite alternate !important;
                animation-duration: 13s !important;
                animation-iteration-count: infinite !important;
            }

            .language-box button {
                transition: none;
            }
        }

        /* =========================================================
           Startup / offline preparation screen
           ========================================================= */
        #fushimi-startup-overlay[hidden] { display: none !important; }
        #fushimi-startup-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: grid;
            place-items: center;
            padding: max(22px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
            background: rgba(246, 246, 244, .88);
            backdrop-filter: blur(28px) saturate(1.18);
            -webkit-backdrop-filter: blur(28px) saturate(1.18);
            opacity: 0;
            visibility: hidden;
            transition: opacity .28s ease, visibility .28s ease;
        }
        #fushimi-startup-overlay.is-visible {
            opacity: 1;
            visibility: visible;
        }
        .fushimi-boot-card {
            width: min(440px, 100%);
            padding: 42px 30px 30px;
            border: 1px solid rgba(255,255,255,.78);
            border-radius: 30px;
            text-align: center;
            color: #202023;
            background: linear-gradient(150deg, rgba(255,255,255,.91), rgba(255,255,255,.68));
            box-shadow: 0 28px 80px rgba(35, 25, 27, .13), inset 0 1px 0 #fff;
        }
        .fushimi-boot-emblem {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 25px;
            border: 1px solid rgba(196,0,24,.10);
            color: #c40018;
            font-size: 35px;
            background: linear-gradient(145deg, #fff, #f9e9eb);
            box-shadow: 0 12px 32px rgba(196,0,24,.12), inset 0 1px 0 #fff;
            animation: fushimiBootFloat 2.8s ease-in-out infinite;
        }
        .fushimi-boot-brand {
            margin: 0 0 12px;
            color: rgba(32,32,35,.46);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .19em;
        }
        .fushimi-boot-card h2 {
            margin: 0;
            font-size: clamp(21px, 5vw, 26px);
            line-height: 1.35;
            letter-spacing: -.035em;
            font-weight: 750;
        }
        .fushimi-boot-intro {
            min-height: 42px;
            margin: 12px 0 25px;
            color: rgba(32,32,35,.62);
            font-size: 13px;
            line-height: 1.75;
        }
        .fushimi-boot-track {
            height: 7px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(35,35,38,.09);
            box-shadow: inset 0 1px 2px rgba(0,0,0,.05);
        }
        .fushimi-boot-track span {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #c40018, #ed6b79);
            box-shadow: 0 0 14px rgba(196,0,24,.20);
            transition: width .24s ease;
        }
        .fushimi-boot-status {
            min-height: 22px;
            margin: 15px 0 3px;
            color: #39393d;
            font-size: 13px;
            font-weight: 650;
        }
        .fushimi-boot-count {
            margin: 0;
            color: rgba(32,32,35,.45);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }
        .fushimi-boot-note {
            margin: 22px 0 0;
            color: rgba(32,32,35,.43);
            font-size: 10px;
            line-height: 1.65;
        }
        @keyframes fushimiBootFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @media (max-width: 480px) {
            .fushimi-boot-card { padding: 36px 24px 26px; border-radius: 26px; }
            .fushimi-boot-emblem { width: 68px; height: 68px; border-radius: 22px; }
        }
        @media (max-height: 540px) {
            .fushimi-boot-card { padding: 20px 24px 18px; }
            .fushimi-boot-emblem { width: 52px; height: 52px; margin-bottom: 10px; border-radius: 17px; font-size: 26px; }
            .fushimi-boot-brand { margin-bottom: 6px; }
            .fushimi-boot-intro { min-height: 0; margin: 7px 0 14px; }
            .fushimi-boot-note { margin-top: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .fushimi-boot-emblem { animation: none; }
            #fushimi-startup-overlay, .fushimi-boot-track span { transition: none; }
        }

    </style>
</head>

<body class="language-page">

    <div class="liquid-cursor" aria-hidden="true"></div>

    <div class="overlay"></div>

    <div class="language-box">

        <h1>⛩</h1>

        <h2>Fushimi Inari Smart Guide</h2>

        <p data-i18n="selectLanguage">
            言語を選択してください
        </p>

        <p data-i18n="pleaseSelectLanguage">
            Please Select Your Language
        </p>

        <button onclick="selectLanguage('ja')">
            🇯🇵 日本語
        </button>

        <button onclick="selectLanguage('en')">
            🇺🇸 English
        </button>

        <button onclick="selectLanguage('zh')">
            🇨🇳 中文
        </button>

        <button onclick="selectLanguage('ko')">
            🇰🇷 한국어
        </button>

    </div>



    <div id="fushimi-startup-overlay" aria-hidden="true" hidden>
        <section class="fushimi-boot-card" role="status" aria-live="polite" aria-atomic="true">
            <div class="fushimi-boot-emblem" aria-hidden="true">⛩</div>
            <p class="fushimi-boot-brand">FUSHIMI INARI · SMART GUIDE</p>
            <h2 id="fushimi-boot-title">ガイドを準備しています</h2>
            <p class="fushimi-boot-intro" id="fushimi-boot-intro">オフラインでも使えるように、必要なデータを保存しています。</p>
            <div class="fushimi-boot-track" id="fushimi-boot-progress" role="progressbar" aria-label="Preparation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span id="fushimi-boot-progress-fill"></span>
            </div>
            <p class="fushimi-boot-status" id="fushimi-boot-status">アプリと観光データを保存中…</p>
            <p class="fushimi-boot-count" id="fushimi-boot-count">0 / 62 項目を確認</p>
            <p class="fushimi-boot-note">初回の準備が終わると、次回からオフラインでも一部の機能を利用できます。</p>
        </section>
    </div>

    <script src="js/liquid-cursor.js?v=94" defer></script>
    <script src="js/app-boot.js?v=129" defer></script>
    <script src="js/offline.js?v=129" defer></script>

    <script src="js/language.js"></script>

</body>

</html>
