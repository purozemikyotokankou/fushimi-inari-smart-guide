        /* =========================================================
           Liquid Glass language screen
        ========================================================= */

        :root {
            --lg-red: #c40018;
            --lg-red-soft: rgba(196, 0, 24, 0.22);
            --lg-white: rgba(255, 255, 255, 0.72);
            --lg-white-soft: rgba(255, 255, 255, 0.18);
            --lg-border: rgba(255, 255, 255, 0.42);
            --lg-text: #19191b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body.language-page {
            min-height: 100vh;
            overflow: hidden;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            color: var(--lg-text);

            background:
                radial-gradient(circle at 16% 18%, rgba(255, 86, 109, 0.34), transparent 25%),
                radial-gradient(circle at 83% 14%, rgba(255, 179, 194, 0.42), transparent 27%),
                radial-gradient(circle at 76% 83%, rgba(154, 38, 55, 0.24), transparent 28%),
                linear-gradient(135deg, #f7f7f4 0%, #ececea 52%, #e4e4e1 100%);
        }

        /* Soft blurred light blobs */

        body.language-page::before,
        body.language-page::after {
            content: "";
            position: fixed;
            pointer-events: none;
            border-radius: 999px;
            filter: blur(18px);
            mix-blend-mode: screen;
        }

        body.language-page::before {
            width: 40vw;
            height: 40vw;
            min-width: 260px;
            min-height: 260px;
            left: -10vw;
            top: 45%;
            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.76),
                    rgba(255, 255, 255, 0)
                );
            animation: floatLeft 11s ease-in-out infinite alternate;
        }

        body.language-page::after {
            width: 34vw;
            height: 34vw;
            min-width: 240px;
            min-height: 240px;
            right: -8vw;
            bottom: -8vw;
            background:
                radial-gradient(
                    circle,
                    var(--lg-red-soft),
                    rgba(255, 255, 255, 0)
                );
            animation: floatRight 13s ease-in-out infinite alternate;
        }

        .overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                linear-gradient(
                    115deg,
                    rgba(255,255,255,0.48) 0%,
                    rgba(255,255,255,0.10) 35%,
                    rgba(255,255,255,0.30) 65%,
                    rgba(255,255,255,0.10) 100%
                );

            backdrop-filter: blur(10px) saturate(1.08);
            -webkit-backdrop-filter: blur(10px) saturate(1.08);
        }

        /* Language card */

        .language-box {
            width: min(520px, 100%);
            padding: 52px 42px 38px;
            position: relative;
            isolation: isolate;

            border: 1px solid var(--lg-border);
            border-radius: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.66),
                    rgba(255,255,255,0.28) 46%,
                    rgba(255,255,255,0.40)
                );

            box-shadow:
                0 35px 80px rgba(31, 31, 33, 0.16),
                inset 0 1px 0 rgba(255,255,255,0.80),
                inset 0 -1px 0 rgba(255,255,255,0.18);

            backdrop-filter: blur(30px) saturate(1.35);
            -webkit-backdrop-filter: blur(30px) saturate(1.35);

            text-align: center;

            animation:
                glassIn 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both,
                glassFloat 7s ease-in-out 1.1s infinite;
        }

        .language-box::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 33px;
            pointer-events: none;
            z-index: -1;

            background:
                linear-gradient(
                    155deg,
                    rgba(255,255,255,0.58),
                    rgba(255,255,255,0.00) 34%
                );
        }

        .language-box::after {
            content: "";
            position: absolute;
            left: 14%;
            top: 12px;
            width: 72%;
            height: 1px;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
            filter: blur(0.2px);
            pointer-events: none;
        }

        .language-box h1 {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;

            display: grid;
            place-items: center;

            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.68);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.72),
                    rgba(255,255,255,0.22)
                );

            box-shadow:
                0 15px 28px rgba(196, 0, 24, 0.13),
                inset 0 1px 0 rgba(255,255,255,0.86);

            color: var(--lg-red);
            font-size: 34px;
            line-height: 1;
            text-shadow: 0 2px 12px rgba(196, 0, 24, 0.13);
        }

        .language-box h2 {
            margin: 0 0 14px;

            font-size: clamp(28px, 4vw, 39px);
            line-height: 1.08;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        .language-box p {
            margin: 0;
            color: rgba(25, 25, 27, 0.68);
            font-size: 14px;
            line-height: 1.7;
        }

        .language-box p + p {
            margin-top: 2px;
            font-size: 13px;
            color: rgba(25, 25, 27, 0.48);
        }

        .language-box button {
            width: 100%;
            margin-top: 12px;
            min-height: 56px;
            padding: 0 22px;

            border: 1px solid rgba(255,255,255,0.50);
            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.58),
                    rgba(255,255,255,0.20)
                );

            color: #1b1b1d;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.70),
                0 8px 20px rgba(31,31,33,0.06);

            backdrop-filter: blur(18px) saturate(1.25);
            -webkit-backdrop-filter: blur(18px) saturate(1.25);

            cursor: pointer;

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                background 0.22s ease,
                border-color 0.22s ease;
        }

        .language-box button:hover {
            transform: translateY(-2px) scale(1.012);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.74),
                    rgba(255,255,255,0.30)
                );

            border-color: rgba(255,255,255,0.74);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.86),
                0 14px 28px rgba(31,31,33,0.10);
        }

        .language-box button:active {
            transform: translateY(0) scale(0.992);
        }

        .language-box button:first-of-type:hover {
            box-shadow:
                0 14px 28px rgba(196, 0, 24, 0.12),
                inset 0 1px 0 rgba(255,255,255,0.86);
        }

        /* Animations */

        @keyframes glassIn {
            from {
                opacity: 0;
                transform: translateY(22px) scale(0.965);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes glassFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes floatLeft {
            from {
                transform: translate3d(0, -4%, 0) scale(1);
            }
            to {
                transform: translate3d(5%, 4%, 0) scale(1.08);
            }
        }

        @keyframes floatRight {
            from {
                transform: translate3d(0, 2%, 0) scale(1);
            }
            to {
                transform: translate3d(-5%, -5%, 0) scale(1.10);
            }
        }

        /* =========================================================
           Liquid Glass Cursor
        ========================================================= */

        body.language-page,
        body.language-page button {
            cursor: none;
        }

        .liquid-cursor {
            position: fixed;
            left: 0;
            top: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;

            border: 1px solid rgba(255, 255, 255, 0.78);

            background:
                radial-gradient(
                    circle at 30% 25%,
                    rgba(255, 255, 255, 0.92),
                    rgba(255, 255, 255, 0.26) 38%,
                    rgba(255, 255, 255, 0.10) 70%,
                    rgba(196, 0, 24, 0.10) 100%
                );

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.14),
                0 8px 24px rgba(31, 31, 33, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.88);

            backdrop-filter: blur(10px) saturate(1.35);
            -webkit-backdrop-filter: blur(10px) saturate(1.35);

            transform: translate3d(-50%, -50%, 0) scale(1);
            opacity: 0;

            transition:
                width 0.22s ease,
                height 0.22s ease,
                opacity 0.2s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;

            will-change: transform, width, height, opacity;
        }

        .liquid-cursor::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: rgba(196, 0, 24, 0.85);

            box-shadow:
                0 0 10px rgba(196, 0, 24, 0.38),
                0 0 22px rgba(196, 0, 24, 0.20);
        }

        .liquid-cursor::after {
            content: "";
            position: absolute;
            inset: -7px;
            border-radius: 50%;
            border: 1px solid rgba(196, 0, 24, 0.20);
            opacity: 0.7;
            transform: scale(0.88);
            transition: transform 0.28s ease, opacity 0.28s ease;
        }

        .liquid-cursor.is-visible {
            opacity: 1;
        }

        .liquid-cursor.is-hover {
            width: 48px;
            height: 48px;
            border-color: rgba(255, 255, 255, 0.92);

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.16),
                0 12px 32px rgba(196, 0, 24, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.94);
        }

        .liquid-cursor.is-hover::after {
            transform: scale(1.04);
            opacity: 1;
        }

        .liquid-cursor.is-down {
            width: 27px;
            height: 27px;
        }

        .cursor-ripple {
            position: fixed;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;

            border: 1px solid rgba(196, 0, 24, 0.50);

            box-shadow:
                0 0 18px rgba(196, 0, 24, 0.16),
                inset 0 0 10px rgba(255, 255, 255, 0.25);

            transform: translate3d(-50%, -50%, 0) scale(1);

            animation:
                cursorRipple 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cursorRipple {
            0% {
                opacity: 0.75;
                transform: translate3d(-50%, -50%, 0) scale(0.7);
            }
            100% {
                opacity: 0;
                transform: translate3d(-50%, -50%, 0) scale(4.8);
            }
        }

        @media (pointer: coarse), (max-width: 700px) {
            body.language-page,
            body.language-page button {
                cursor: auto;
            }

            .liquid-cursor,
            .cursor-ripple {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .liquid-cursor,
            .liquid-cursor::after {
                transition: none;
            }

            .cursor-ripple {
                display: none;
            }
        }

        /* Mobile layout */

        @media (max-width: 600px) {
            body.language-page {
                padding: 16px;
            }

            .language-box {
                padding: 40px 22px 24px;
                border-radius: 28px;
            }

            .language-box::before {
                border-radius: 27px;
            }

            .language-box h1 {
                width: 68px;
                height: 68px;
                border-radius: 21px;
            }

            .language-box h2 {
                font-size: 29px;
            }

            .language-box button {
                min-height: 54px;
                border-radius: 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .language-box {
                animation: none;
            }

            body.language-page::before {
                animation: floatLeft 11s ease-in-out infinite alternate !important;
                animation-duration: 11s !important;
                animation-iteration-count: infinite !important;
            }

            body.language-page::after {
                animation: floatRight 13s ease-in-out infinite alternate !important;
                animation-duration: 13s !important;
                animation-iteration-count: infinite !important;
            }

            .language-box button {
                transition: none;
            }
        }
    </style>
</head>

                    align-items: center;
                    gap: 9px;

                    min-height: 38px;

                    margin: 18px 0 14px;
                    padding: 10px 12px;

                    border-radius: 12px;

                    background: rgba(196,0,24,.055);

                    font-size: 12px;
                    line-height: 1.5;
                }

                /* Buttons */

                .fsg-actions {
                    display: grid;
                    grid-template-columns: 1fr 1.25fr;
                    gap: 10px;

                    margin-top: 15px;
                }

                .fsg-actions button {
                    min-height: 48px;

                    margin: 0;
                    padding: 9px 12px;

                    border: 1px solid rgba(0,0,0,.08);
                    border-radius: 13px;

                    font: inherit;
                    font-size: 13px;
                    font-weight: 650;

                    cursor: pointer;
                }

                .fsg-back {
                    color: #333;
                    background: #f0f0f0;
                }

                .fsg-agree {
                    color: white;
                    background: #c40018;
                    border-color: #c40018 !important;
                }

                .fsg-actions button:disabled {
                    opacity: .55;
                    cursor: wait;
                }

                /* Cursor must stay above the notice */

                .liquid-cursor {
                    position: fixed !important;
                    z-index: 2147483647 !important;
                    pointer-events: none !important;
                }

                .cursor-ripple {
                    position: fixed !important;
                    z-index: 2147483646 !important;
                    pointer-events: none !important;
                }

                /* Mobile */

                @media (max-width: 430px) {
                    .fsg-card {
                        padding: 25px 19px 20px;
                    }

                    .fsg-card h2 {
                        font-size: 21px;
                    }

                    .fsg-copy {
                        font-size: 13px;
                    }

                    .fsg-actions {
                        grid-template-columns: 1fr;
                    }
                }

                /* Reduced motion */

                @media (prefers-reduced-motion: reduce) {
                    .fsg-spinner {
                        animation-duration: 2s;
                    }
                }
            `;

            document.head.appendChild(style);
        }

        /* =====================================================
           Language screen rolling indicator
        ===================================================== */

        function addIndicator() {
            const box = document.querySelector('.language-box');

            if (!box) return;

            if (document.getElementById('fsg-language-preparation')) {
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.id = 'fsg-language-preparation';
            wrapper.className = 'fsg-preparation';

            wrapper.setAttribute('role', 'status');
            wrapper.setAttribute('aria-live', 'polite');

            const spinner = document.createElement('span');
            spinner.className = 'fsg-spinner';
            spinner.setAttribute('aria-hidden', 'true');

            languageIndicator = document.createElement('span');
            languageIndicator.textContent = TEXT.ja.preparing;

            wrapper.append(spinner, languageIndicator);

            box.appendChild(wrapper);
        }

        function updateIndicator(message) {
            if (languageIndicator) {
                languageIndicator.textContent = message;
            }
        }

        /* =====================================================
           Prepare data
        ===================================================== */

        async function fetchJson(path) {
            const response = await fetch(path, {
                cache: 'no-cache'
            });

            if (!response.ok) {
                throw new Error(path + ' HTTP ' + response.status);
            }

            const data = await response.json();

            if (data === null || typeof data !== 'object') {
                throw new Error('Invalid JSON: ' + path);
            }

            return data;
        }

        function startPreparation() {
            if (prepared) {
                return Promise.resolve();
            }

            if (preparation) {
                return preparation;
            }

            preparation = Promise.all([
                fetchJson('./data/spots.json'),
                fetchJson('./data/routes.json')
            ]).then(([spots, routes]) => {

                prepared = true;

                window.FushimiStartupPrepared = {
                    spots,
                    routes
                };

                updateIndicator(TEXT.ja.ready);

                if (activeStatus) {
                    let currentLanguage = 'ja';

                    try {
                        currentLanguage = localStorage.getItem('language') || 'ja';
                    } catch (_) {}

                    const copy = TEXT[currentLanguage] || TEXT.ja;
                    activeStatus.textContent = copy.ready;
                }

                return window.FushimiStartupPrepared;

            }).catch(error => {

                preparation = null;

                console.error(
                    '[Fushimi] Preparation error:',
                    error
                );

                throw error;
            });

            return preparation;
        }

        /* =====================================================
           Consent storage
        ===================================================== */

        function accepted(language) {
            try {
                return localStorage.getItem(CONSENT_KEY) ===
                    VERSION + ':' + language;
            } catch (_) {
                return false;
            }
        }

        function saveAcceptance(language) {
            try {
                localStorage.setItem(
                    CONSENT_KEY,
                    VERSION + ':' + language
                );
            } catch (error) {
                console.warn(
                    '[Fushimi] Consent could not be saved:',
                    error
                );
            }
        }

        /* =====================================================
           Notice dialog
        ===================================================== */

        function showDialog(language, showNotice) {
            const copy = TEXT[language] || TEXT.ja;

            const backdrop = document.createElement('div');
            backdrop.className = 'fsg-backdrop';

            const card = document.createElement('section');
            card.className = 'fsg-card';

            card.setAttribute('role', 'dialog');
            card.setAttribute('aria-modal', 'true');
            card.setAttribute('aria-labelledby', 'fsg-notice-title');

            /* Title */

            const heading = document.createElement('h2');
            heading.id = 'fsg-notice-title';

            heading.textContent = showNotice
                ? copy.title
                : copy.loading;

            card.appendChild(heading);

            /* Notice text */

            if (showNotice) {

                copy.notice.forEach((message, index) => {

                    const paragraph = document.createElement('p');
                    paragraph.className = 'fsg-copy';

                    /*
                     * Only emphasize the disclaimer phrase.
                     * The rest of the paragraph stays normal.
                     */

                    if (
                        index === copy.notice.length - 1 &&
                        copy.disclaimerPhrase
                    ) {
                        const position = message.lastIndexOf(
                            copy.disclaimerPhrase
                        );

                        if (position >= 0) {

                            paragraph.appendChild(
                                document.createTextNode(
                                    message.slice(0, position)
                                )
                            );

                            const emphasis = document.createElement('strong');

                            emphasis.className = 'fsg-disclaimer';
                            emphasis.textContent = message.slice(position);

                            paragraph.appendChild(emphasis);

                        } else {
                            paragraph.textContent = message;
                        }

                    } else {
                        paragraph.textContent = message;
                    }

                    card.appendChild(paragraph);
                });
            }

            /* Loading status */

            const status = document.createElement('div');
            status.className = 'fsg-status';

            status.setAttribute('role', 'status');
            status.setAttribute('aria-live', 'polite');

            const spinner = document.createElement('span');
            spinner.className = 'fsg-spinner';
            spinner.setAttribute('aria-hidden', 'true');

            const statusText = document.createElement('span');

            statusText.textContent = prepared
                ? copy.ready
                : copy.waiting;

            activeStatus = statusText;

            status.append(spinner, statusText);
            card.appendChild(status);

            /* Buttons */

            const actions = document.createElement('div');
            actions.className = 'fsg-actions';

            const back = document.createElement('button');

            back.className = 'fsg-back';
            back.type = 'button';
            back.textContent = copy.back;

            back.addEventListener('click', () => {
                backdrop.remove();
                activeStatus = null;
            });

            const agree = document.createElement('button');

            agree.className = 'fsg-agree';
            agree.type = 'button';

            agree.textContent = showNotice
                ? copy.agree
                : copy.retry;

            agree.addEventListener('click', async () => {

                agree.disabled = true;
                back.disabled = true;

                statusText.textContent = copy.waiting;
                spinner.style.display = 'inline-block';

                try {

                    /*
                     * Wait for spots.json and routes.json.
                     * The large video is not waited on here.
                     */

                    await startPreparation();

                    /*
                     * Save consent only after successful preparation.
                     */

                    if (showNotice) {
                        saveAcceptance(language);
                    }

                    statusText.textContent = copy.ready;

                    window.location.href = 'home.html';

                } catch (error) {

                    console.error(
                        '[Fushimi] Could not continue:',
                        error
                    );

                    statusText.textContent = copy.error;

                    spinner.style.display = 'none';

                    agree.textContent = copy.retry;

                    agree.disabled = false;
                    back.disabled = false;
                }
            });

            actions.append(back, agree);
            card.appendChild(actions);

            backdrop.appendChild(card);
            document.body.appendChild(backdrop);

            /*
             * Put keyboard focus on the main action.
             */

            requestAnimationFrame(() => {
                agree.focus();
            });
        }

        /* =====================================================
           Language selection
        ===================================================== */

        function chooseLanguage(language) {

            const selected = [
                'ja',
                'en',
                'zh',
                'ko'
            ].includes(language)
                ? language
                : 'ja';

            try {
                localStorage.setItem('language', selected);
            } catch (_) {}

            document.documentElement.lang = selected;

            /*
             * Already accepted:
             * Skip the notice, but still make sure required data is ready.
             */

            if (accepted(selected)) {

                if (prepared) {
                    window.location.href = 'home.html';
                } else {
                    showDialog(selected, false);
                }

                return;
            }

            /*
             * First visit or updated notice:
             * Show the notice.
             */

            showDialog(selected, true);
        }

        /* =====================================================
           Startup
        ===================================================== */

        addStyles();

        addIndicator();

        /*
         * Start preparing data immediately when index.html opens.
         */

        startPreparation().catch(() => {

            updateIndicator(
                'データの準備に失敗しました。言語選択後に再試行できます。'
            );

        });

        /*
         * app-boot.js is loaded with defer.
         * Replace its direct navigation after deferred scripts run.
         */

        document.addEventListener('DOMContentLoaded', () => {

            window.selectLanguage = chooseLanguage;

        }, { once: true });

    })();
    </script>

</body>
